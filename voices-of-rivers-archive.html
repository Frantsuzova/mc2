ity":"danube","scene":2,"desc":"Май на Дунае! Вода, шелест листьев и многоголосый птичий хор. Кажется (авторы записи не орнитологи), в этом хоре можно расслышать и голос воробья, что было бы не удивительно: воробей очень сербская птица и один из символов сербской столицы – Белграда.","title_en":"Danube, May 2026","title_sr":"Dunav, maj 2026.","peaks":[0.828,0.815,0.854,0.7,0.771,0.628,0.79,0.953,0.795,0.783,0.75,0.831,0.782,0.724,0.752,0.812,0.695,0.736,0.706,0.709,0.74,0.739,0.702,0.7,0.813,0.769,0.756,0.725,0.745,0.724,0.699,0.744,0.609,0.828,0.882,0.748,0.701,0.864,0.836,0.874,0.971,0.809,0.8,0.799,0.891,0.998,0.918,1.0,0.875,0.831,0.882,0.891,0.877,0.9,0.883,0.846,0.822,0.941,0.887,0.906,0.902,0.816,0.784,0.824,0.76,0.708,0.702,0.694,0.664,0.669,0.724,0.739,0.672,0.702,0.479,0.0],"desc_en":"May on the Danube! Water, rustling leaves and a whole choir of birds. It seems that one of the voices might belong to a sparrow. The people who made the recording are not ornithologists, but that would not be surprising. The sparrow is a very Serbian bird and one of the symbols of Belgrade, the country's capital.","desc_sr":"Maj na Dunavu! Voda, šuštanje lišća i mnogoglasni hor ptica. Možda se među glasovima čuje i vrabac. Autori snimka nisu ornitolozi, ali to ne bi bilo iznenađenje: vrabac je veoma srpska ptica i jedan od simbola Beograda.","preview_ru":"Май на Дунае! Вода, шелест листьев и многоголосый птичий хор."}],"scenes":[{"title":"О чём говорит мост","city":"danube","cityTitle":"НОВИ-САД · ДУНАЙ","image":"1.jpg","audios":["bridge"],"desc":"Так звучит голос Варадинского моста через Дунай в Нови-Саде. Ему есть, что рассказать о себе и о событиях истории ХХ в., в которой мосты разделяли судьбу строившей их страны. Первый мост, имевший тогда другое название, был построен в 1920-х гг. и стал символом развития межвоенного Нови-Сада. Он был взорван, восстановлен и опять уничтожен во время Второй мировой войны. Потом мост отстроили, дали ему новое имя, но во время бомбардировок Югославии в 1999-м и он был разрушен. Мост, существующий сегодня, восстановили только в 2000 г., используя опоры предыдущих конструкций. По человеческим меркам современный Варадинский мост совсем еще молод, но в обертонах его металлического голоса можно уловить отзвуки прошлого, услышать гул  времени, ощутить связь с местом, судьбой народа, страны.","side":"right","en":{"title":"What the bridge tells us","cityTitle":"NOVI SAD · DANUBE","desc":"The Varadin Bridge remembers its many lives. It was built in the 1920s, destroyed during World War II, rebuilt, then destroyed again in 1999. Its metal voice carries the memory of the city."},"sr":{"title":"O čemu govori most","cityTitle":"NOVI SAD · DUNAV","desc":"Varadinski most pamti svoje mnoge živote. Izgrađen je dvadesetih godina, srušen u Drugom svetskom ratu, obnovljen, pa ponovo uništen 1999. Njegov metalni glas čuva sećanje grada."}},{"title":"Говорит сфинкс","city":"neva","cityTitle":"САНКТ-ПЕТЕРБУРГ · НЕВА","image":"2.jpg","audios":["sphinx"],"desc":"Звучит «западный» сфинкс – правый, если встать на набережной спиной к Академии художеств.\n\nСфинксы Аменхотепа III, созданные в XIV в. до н.э. для Поминального храма фараона в Фивах, были обнаружены в XIX в., в период расцвета европейской моды на египетскую древность. После долгих приключений с приобретением и перевозкой скульптур, сфинксы оказались в Петербурге и в 1834 г. заняли пьедесталы на набережной Невы у Академии художеств, на пристани, спроектированной архитектором Тоном.\n\nСфинксы, наверное, многое помнят, в том числе и сюжет о прибытии в Петербург. Но они не рассказывают истории. «… Аменхотеп, властитель Фив, возлюбленный Амоном, именем мощный, которому дана жизнь в вечности, подобно Ра», написано на основании скульптуры «западного» сфинкса.  Если вода, по словам известного поэта, это время, то сфинкс – вечность. Вслушиваясь в плеск воды-времени в сопровождении невского ветра, в звучании сфинкса можно расслышать голос вечности – загадочный, даже пугающий.","side":"left","en":{"title":"The sphinx speaks","cityTitle":"SAINT PETERSBURG · NEVA","desc":"The sphinxes of Amenhotep III have stood on the University Embankment since the nineteenth century. These ancient stone witnesses seem to listen to the river and the city."},"sr":{"title":"Govori sfinga","cityTitle":"SANKT PETERBURG · NEVA","desc":"Sfinge Amenhotepa III stoje na Univerzitetskom keju od XIX veka. Ovi drevni kameni svedoci kao da slušaju reku i grad."}},{"title":"Живой берег","city":"danube","cityTitle":"НОВИ-САД · ДУНАЙ","image":"3.jpg","audios":["dove","birds"],"desc":"На берегу Дуная слышны голоса птиц, шелест листвы и вода. Кольчатая горлица — гугутка — и майский птичий хор образуют самостоятельный звуковой портрет берега.","side":"right","en":{"title":"The living shore","cityTitle":"NOVI SAD · DANUBE","desc":"A turtle dove calls from the trees beside the Danube. Birds sing, leaves rustle and water moves. Two recordings bring us close to the sound of the riverbank."},"sr":{"title":"Živa obala","cityTitle":"NOVI SAD · DUNAV","desc":"Na obali Dunava čuju se gugutka, ptice, šuštanje lišća i voda. Dva snimka čuvaju zvučni pejzaž obale."}},{"title":"Шёл трамвай","city":"neva","cityTitle":"САНКТ-ПЕТЕРБУРГ · НЕВА","image":"4.jpg","audios":["tram","rain"],"desc":"Трамвай на Университетской набережной, музыка летних эстрад и дождь над Ленинградом. Городская память сохраняется в знакомых мелодиях и звуках, которых уже нельзя услышать в прежнем месте.","side":"left","en":{"title":"A tram once passed","cityTitle":"SAINT PETERSBURG · NEVA","desc":"A tram crossed the University Embankment. Music sounded in summer gardens. Rain fell over Leningrad. These recordings bring back sounds that no longer belong to the same places."},"sr":{"title":"Prošao je tramvaj","cityTitle":"SANKT PETERBURG · NEVA","desc":"Tramvaj na Univerzitetskom keju, muzika u letnjim baštama i kiša nad Lenjingradom. Sećanje na grad čuva zvuke koje više ne čujemo na istim mestima."}},{"title":"Голубой Дунай","city":"both","cityTitle":"ДУНАЙ ↔ НЕВА","image":"5.jpg","audios":["waltz"],"desc":"Знаменитый вальс Иоганна Штрауса-младшего «На прекрасном голубом Дунае» («Голубой Дунай»), созданный в Вене в 1866 г., исполняет оркестр Марека Вебера – один из самых известных эстрадных коллективов в Европе 1920-х–1930-х гг. Запись сделана на пластинке Ленинградского завода грампластинок, торжественно открытого в 1948 г. и первоначально оборудованного трофейной техникой немецкого завода грампластинок «Tempo». Пластинка 78 оборотов в минуту 1949 года выпуска, о чем свидетельствует номер на этикетке 16928. Такие пластинки проигрывались всего 2-3 минуты, выпуск долгоиграющих пластинок начнут на заводе только в 1956-м. Надпись под ГОСТОМ «третий кл.» означает «третий класс» – так в советской системе классификации указывалась категория музыки. Третий класс – это эстрадные или танцевальные записи. В верхней части бумажного круга – изображение скульптуры В.И. Мухиной «Рабочий и колхозница», в те годы оно иногда использовалось в качестве эмблемы предприятия.  В 1964 г. Ленинградский завод грампластинок войдет в структуру ВФГ «Мелодия» и на этикетках появится знакомый многим логотип в виде стилизованной буквы «М».","side":"right","en":{"title":"The Blue Danube","cityTitle":"DANUBE ↔ NEVA","desc":"Johann Strauss’s waltz, performed by Marek Weber’s orchestra, was released on a record made in Leningrad. Music from the Danube finds a home on the banks of the Neva."},"sr":{"title":"Na lepom plavom Dunavu","cityTitle":"DUNAV ↔ NEVA","desc":"Valcer Johana Štrausa izvodi orkestar Mareka Vebera. Ploča je proizvedena u Lenjingradu: muzika Dunava stiže do obala Neve."}},{"title":"Осенний дождь","city":"both","cityTitle":"НОВИ-САД ↔ САНКТ-ПЕТЕРБУРГ","image":"6.jpg","audios":["autumn"],"desc":"Легендарный петербургский актер Николай Мартон читает стихи легендарного сербского поэта Мирослава Антича. Антич был 1932 года рождения, Мартон родился в 1934-м – они ровесники. Бо‎́‎льшая часть жизни Мирослава Антича прошла в Нови-Саде, на берегах Дуная. Бо‎́‎льшая часть жизни Николая Мартона связана с городом на Неве. Может быть поэтому стихи поэта из Нови-Сада в исполнении Мартона звучат очень по-петербургски: тень и золото загадочных карет, затонувшие корабли, несмелая улыбка сквозь дымку осеннего дождя под надрывный чаячий плач и мерный шум набегающей на берег волны.","side":"left","en":{"title":"Autumn rain","cityTitle":"NOVI SAD ↔ SAINT PETERSBURG","desc":"The Saint Petersburg actor Nikolai Marton reads poetry by Miroslav Antić, a Serbian poet closely linked to Novi Sad. Their voices bring the two cities together."},"sr":{"title":"Jesenja kiša","cityTitle":"NOVI SAD ↔ SANKT PETERBURG","desc":"Peterburški glumac Nikolaj Marton čita stihove Miroslava Antića, pesnika vezanog za Novi Sad. Pesnički glas povezuje dva grada."}}]},"intro":{"ru":{"k":"ПРОЕКТ «ГОЛОСА РЕК» · 2026","h":"Между двумя берегами","lead":"Если сесть в лодку здесь, можно добраться до твоего Санкт-Петербурга","by":"Слова 90-летнего жителя Ковина, Сербия","p1":"Этот проект начался случайно. В разговоре с 90-летним жителем Ковина (Сербия) фотограф Анна Французова услышала простую мысль: если сесть в лодку в его городе, можно добраться до Санкт-Петербурга. Так возник образ непрерывного водного пути, связывающего людей, города и культурные контексты.","p2":"Эта встреча и прогулки по Сербии стали важным впечатлением, которым захотелось поделиться. Разговоры со знакомыми и друзьями рождали новые ассоциации, идеи и наблюдения. Постепенно появился проект «Голоса рек», а вокруг него сложилась команда. Каждый привносил и продолжает привносить своё: истории, фотографии, аудио- и видеоматериалы, разговоры и наблюдения. Из этого и складывается смысловое пространство проекта.","p3":"Нас заинтересовало, как река влияет на мышление, память и чувство дома. В Петербурге выражение «город на Неве» давно стало частью городского самовосприятия: Нева задаёт повседневные ориентиры и маршруты, связывает семейные истории с личной и коллективной памятью. В Сербии часто можно услышать: «мы живём вверх по Дунаю», «если спускаться по Дунаю», «а пошли на Дунай». Здесь река хранит историческую память, составляет важную часть культуры и объединяет разные места, к которым люди чувствуют принадлежность.","p4":"Проект задуман как исследование на пересечении искусства и академической практики. Нам было важно обратиться к опыту, который трудно изучать со стороны: личному проживанию связи с рекой. Собирая истории жителей, мы пытались понять их изнутри через звук, визуальные образы и объекты. Так сформировались четыре взаимосвязанных слоя экспозиции.","photoh":"Мгновение","photo":"Аналоговая фотография удерживает мгновение и тем самым делает ощутимой относительность времени: продлевает жизнь момента и одновременно показывает его хрупкость. Воспоминания подобны рисункам на песке, которые способна смыть волна. Но пережитый во всей полноте момент остаётся в памяти. Через детали на фотографиях мы прослеживаем личные маршруты и истории жителей.","videoh":"Движение времени","video":"Видео показывает не одно мгновение, а длительность. В видеоарте мы исследуем реку как непрерывный процесс, формирующий пространство вокруг себя, и соединяем наблюдение с художественным впечатлением.","storiesh":"Память","stories":"Личные воспоминания жителей и есть голоса рек. Доверенные нам истории и важные моменты стали душой проекта. Рядом с ними возникают предметы, связанные с рассказами: они дополняют воспоминания или сами становятся их героями.","soundh":"Ритм","sound":"В рамках проекта были записаны Нева и Дунай в разных локациях. Мы работаем со звуком как с исследовательским и художественным методом: собираем полевые записи рек и городской среды, а также используем контактную звукозапись, чтобы услышать вибрации мостов, набережных и других объектов. Так звуковой слой фиксирует не только атмосферу места, но и его материальную, почти скрытую жизнь.","go":"ИССЛЕДОВАТЬ АРХИВ","chap":"01 / ЗВУКОВОЙ АРХИВ","vidtag":"02 / ВИДЕОАРТ","vidtitle":"Два города в движении","vidintro":"Звук, воспоминания и движения воды стали отправной точкой для двух видеоарт-работ. Это впечатления о Дунае и Неве, созданные на пересечении искусства и исследования.","histag":"03 / ЛИЧНЫЕ ИСТОРИИ","histitle":"Истории у воды","more":"Читать далее","less":"Свернуть","all":"Все","danube":"Дунай","neva":"Нева","orig":"оригинал","langru":"Русский","langsr":"Сербский","langen":"Английский","author":"Автор","anon":"Анонимно","note":"* Переводы представлены не для всех историй. Мы постепенно пополняем архив.","city1":"Нови-Сад · Дунай","city2":"Санкт-Петербург · Нева","both":"Нови-Сад ↔ Санкт-Петербург","foot":"Авторы проекта","back":"","play":"Воспроизвести","pause":"Пауза","participants":"При участии Максима Новикова, Тияны Йеврич, Даниила Леонова","navintro":"О проекте","navsound":"Звуковой архив","navphoto":"Фотографии","navvideo":"Видеоарт","navstories":"Истории","menu":"Содержание","methodlabel":"ART & SCIENCE / ЧЕТЫРЕ СЛОЯ ЭКСПОЗИЦИИ","launched":"сайт запущен в октябре 2026 года"},"en":{"k":"VOICES OF RIVERS · 2026","h":"Between two banks","lead":"If you get into a boat here, you can reach your Saint Petersburg","by":"A 90-year-old resident of Kovin, Serbia","p1":"This project began by chance. In a conversation with a 90-year-old resident of Kovin in Serbia, photographer Anna Frantsuzova heard a simple thought: if you take a boat from his town, you can reach Saint Petersburg. The idea of a continuous waterway connecting people, cities and cultures began there.","p2":"That meeting and the walks through Serbia left a strong impression. Sharing it with friends and colleagues led to new conversations, ideas and observations. Voices of Rivers slowly took shape, and a team formed around it. Each person brought, and still brings, stories, photographs, audio and video recordings, conversations and impressions. Together they form the world of the project.","p3":"We began to ask how rivers shape thought, memory and the feeling of home. In Saint Petersburg, people often describe their city through the Neva. The river gives them everyday routes and landmarks, and holds both family stories and collective memory. In Serbia, people say “we live upstream on the Danube”, “if you go downstream”, or “let’s go to the Danube”. The river is part of history, culture and the sense of belonging to the places it connects.","p4":"The project is a study that brings art and academic research together. We wanted to approach something difficult to study from the outside: the personal experience of living beside a river. We gathered people’s stories and tried to understand them through sound, images and objects. Four connected layers grew from this approach.","photoh":"A moment","photo":"Analogue photography holds a moment still and makes the passage of time visible. It extends the life of an instant but also shows how fragile it is. Memories are like drawings in sand, which a wave can wash away. Yet a moment we experience deeply may stay with us. We use details in photographs to trace personal routes and stories.","videoh":"Time in motion","video":"Video shows duration rather than a single instant. In video art we explore the river as an ongoing process that shapes the space around it. Observation becomes an artistic impression.","storiesh":"Memory","stories":"The memories shared by residents are the voices of the rivers. These personal stories and meaningful moments are the heart of the project. Objects connected to the memories appear beside them. Sometimes they add something to a story; sometimes they are the main characters.","soundh":"Rhythm","sound":"Within the project, we recorded the Neva and the Danube in different locations. We treat sound as both a research and an artistic method: we collect field recordings of the rivers and the city around them, and we also use contact microphones to hear the vibrations of bridges, embankments, and other objects. This sound layer captures not only the atmosphere of a place, but also its material, almost hidden life.","go":"EXPLORE THE ARCHIVE","chap":"01 / SOUND ARCHIVE","vidtag":"02 / VIDEO ART","vidtitle":"Two cities in motion","vidintro":"Sounds, memories and moving water inspired these two video art works. They are impressions of the Danube and the Neva, made where art and research meet.","histag":"03 / PERSONAL STORIES","histitle":"Stories by the water","more":"Read more","less":"Show less","all":"All","danube":"Danube","neva":"Neva","orig":"original","langru":"Russian","langsr":"Serbian","langen":"English","author":"Author","anon":"Anonymous","note":"* Not every story is available in every language yet. We are adding translations over time.","city1":"Novi Sad · Danube","city2":"Saint Petersburg · Neva","both":"Novi Sad ↔ Saint Petersburg","foot":"Project authors","back":"","play":"Play","pause":"Pause","participants":"With the participation of Maksim Novikov, Tijana Jevrić, Daniil Leonov","navintro":"About the project","navsound":"Sound archive","navphoto":"Photography","navvideo":"Video art","navstories":"Stories","menu":"Contents","methodlabel":"ART & SCIENCE / FOUR LAYERS OF THE EXHIBITION","launched":"website launched in October 2026"},"sr":{"k":"GLASOVI REKA · 2026","h":"Između dve obale","lead":"Ako ovde sedneš u čamac, možeš stići do svog Sankt Peterburga","by":"Reči devedesetogodišnjeg stanovnika Kovina, Srbija","p1":"Ovaj projekat je počeo slučajno. U razgovoru sa devedesetogodišnjim stanovnikom Kovina u Srbiji fotografkinja Ana Francuzova čula je jednostavnu misao: ako se ukrcaš u čamac u njegovom gradu, možeš stići do Sankt Peterburga. Tako je nastala slika neprekinutog vodenog puta koji povezuje ljude, gradove i kulture.","p2":"Taj susret i šetnje po Srbiji ostavili su snažan utisak. Razgovori sa prijateljima doneli su nove asocijacije, ideje i zapažanja. Postepeno je nastao projekat „Glasovi reka” i okupio se tim. Svako je unosio i još uvek unosi nešto svoje: priče, fotografije, audio i video snimke, razgovore i zapažanja.","p3":"Pitali smo se kako reka utiče na razmišljanje, pamćenje i osećaj doma. U Sankt Peterburgu Neva oblikuje svakodnevne puteve i čuva porodična i zajednička sećanja. U Srbiji se često čuje: „živimo uzvodno na Dunavu”, „ako ideš niz Dunav” ili „hajdemo na Dunav”. Reka je deo istorije, kulture i osećaja pripadnosti mestima koja povezuje.","p4":"Projekat je istraživanje na preseku umetnosti i akademskog rada. Želeli smo da priđemo iskustvu koje je teško posmatrati sa strane: ličnoj vezi sa rekom. Prikupljajući priče stanovnika, pokušali smo da ih doživimo kroz zvuk, slike i predmete. Tako su nastala četiri povezana sloja izložbe.","photoh":"Trenutak","photo":"Analogna fotografija zadržava trenutak i pokazuje relativnost vremena. Ona produžava život jednog trenutka i istovremeno otkriva njegovu krhkost. Sećanja su poput crteža u pesku koje talas može izbrisati. Detaljima fotografija beležimo lične puteve i priče stanovnika.","videoh":"Kretanje vremena","video":"Video prikazuje trajanje, a ne samo jedan trenutak. Kroz video-art posmatramo reku kao proces koji oblikuje prostor oko sebe.","storiesh":"Sećanje","stories":"Lična sećanja stanovnika jesu glasovi reka. Poverene priče i važni trenuci postali su srce projekta. Uz njih se pojavljuju predmeti povezani sa sećanjima: ponekad ih dopunjuju, a ponekad su glavni junaci.","soundh":"Ritam","sound":"U okviru projekta snimili smo Nevu i Dunav na različitim lokacijama. Zvuku pristupamo kao istraživačkom i umetničkom metodu: prikupljamo terenske snimke reka i gradske zvučne sredine, a koristimo i kontaktnu zvučnu registraciju da bismo čuli vibracije mostova, kejeva i drugih objekata. Tako zvučni sloj beleži ne samo atmosferu mesta, već i njegov skriveni materijalni život.","go":"ISTRAŽI ARHIV","chap":"01 / ZVUČNI ARHIV","vidtag":"02 / VIDEO-ART","vidtitle":"Dva grada u pokretu","vidintro":"Zvuci, sećanja i kretanje vode inspirisali su dva video-art rada. To su utisci o Dunavu i Nevi, nastali na susretu umetnosti i istraživanja.","histag":"03 / LIČNE PRIČE","histitle":"Priče kraj vode","more":"Pročitaj više","less":"Sažmi","all":"Sve","danube":"Dunav","neva":"Neva","orig":"original","langru":"Ruski","langsr":"Srpski","langen":"Engleski","author":"Autor","anon":"Anonimno","note":"* Nisu sve priče još prevedene na sve jezike. Arhiv prevoda se postepeno dopunjava.","city1":"Novi Sad · Dunav","city2":"Sankt Peterburg · Neva","both":"Novi Sad ↔ Sankt Peterburg","foot":"Autori projekta","back":"","play":"Pusti","pause":"Pauza","participants":"Uz učešće Maksima Novikova, Tijane Jevrić, Danila Leonova","navintro":"O projektu","navsound":"Zvučni arhiv","navphoto":"Fotografije","navvideo":"Video-art","navstories":"Priče","menu":"Sadržaj","methodlabel":"UMETNOST I NAUKA / ČETIRI SLOJA IZLOŽBE","launched":"sajt je pokrenut u oktobru 2026. godine"}}}</script><nav class="archive-nav" id="archive-nav"><button aria-controls="nav-links" aria-expanded="false" class="nav-toggle" id="nav-toggle" type="button">☰  СОДЕРЖАНИЕ</button><div class="nav-links" hidden="" id="nav-links"><a data-i="navintro" href="#opening"></a><a data-i="navsound" href="#archive"></a><a data-i="navphoto" href="#photography"></a><a data-i="navvideo" href="#videoart"></a><a data-i="navstories" href="#stories"></a></div></nav><script>const P=JSON.parse(document.getElementById('model').textContent), D=P.archive;let LANG='ru',FILTER='all';const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];const T=()=>P.intro[LANG],txt=(s,k)=>LANG==='ru'?s[k]:(s[LANG]&&s[LANG][k])||s[k],name=t=>LANG==='ru'?t.title:LANG==='en'?t.title_en:t.title_sr,desc=t=>LANG==='ru'?t.desc:LANG==='en'?t.desc_en:t.desc_sr;function two(s){let matches=(s||'').trim().match(/[^.!?…]+(?:[.!?…]+(?=\s|$)|$)/g)||[s];let a=matches.slice(0,2).join(' ').trim(),b=matches.slice(2).join(' ').trim();return [a||s,b]};function el(tag,c,text){let e=document.createElement(tag);if(c)e.className=c;if(text!==undefined)e.textCo
