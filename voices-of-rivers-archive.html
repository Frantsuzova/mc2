/* V7 curatorial revision: introduction, routes, and scene reading */
html{scroll-padding-top:76px}
.opening{padding-top:clamp(80px,9vw,134px);padding-bottom:50px}
.opening>.origin{display:block;max-width:1100px;margin:0 auto 58px}
.opening .origin blockquote{max-width:1020px;font-size:clamp(36px,4.4vw,72px);line-height:1.11;letter-spacing:-.042em}
.opening .origin .by{margin-top:28px;margin-left:5px}
.opening .origin blockquote:before{content:'“';left:-.55em;top:-.17em}
.opening>.prose{max-width:1080px;margin:68px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:14px 70px;align-items:start}
.opening>.prose p{font-size:clamp(17px,1.42vw,21px);line-height:1.67;margin:0 0 26px}
.opening>.prose p:first-child{grid-column:1/-1;font-size:clamp(20px,1.9vw,28px);max-width:940px;color:#222b25;line-height:1.52}
.opening>.prose p:nth-child(2){grid-column:1/-1;max-width:1000px;padding-bottom:32px;border-bottom:1px solid var(--line)}
.opening>.prose p:nth-child(3){grid-column:1}
.opening>.prose p:nth-child(4){grid-column:2}
.method-title{margin-top:50px}
.method{gap:36px 60px}
.method article{position:relative;padding:0 26px 24px 0;transition:transform .25s ease,border-color .25s ease}
.method article:hover{transform:translateY(-4px);border-color:#8ba69b}
.method-link{display:grid;place-items:center;position:absolute;right:2px;top:0;font:20px Arial,sans-serif;color:var(--green);width:34px;height:34px;border:1px solid #b7c9bb;border-radius:50%;text-decoration:none}
.method-link:hover{background:#dce8dc}
.start{margin-top:23px;display:inline-flex;align-items:center;border:1px solid #567b67;background:#416a54;color:#fbfaf4;padding:15px 24px;font-size:12px;letter-spacing:.1em;transition:background .2s ease,transform .2s ease}
.start:hover{background:#2b503b;transform:translateY(-2px)}
.archive-head{padding-top:24px;padding-bottom:0}
.archive-head .mono{letter-spacing:.18em}
.anchor-point{position:absolute;top:0}
.chapter{min-height:max(100vh,780px);padding-top:105px;padding-bottom:105px}
.chapter.is-reading{min-height:115vh}
.chapter .info{width:min(36vw,510px)}
.chapter .full-text{max-height:none!important;overflow:visible!important;white-space:pre-line;font:16px/1.65 Georgia,serif}
.chapter .caption{font:16px/1.58 Georgia,serif}
.confluence{height:160px;margin:18px auto 54px;max-width:1380px;overflow:hidden}
.confluence svg{width:100%;height:100%}
.confluence path{stroke-dasharray:none;stroke-width:3.5;stroke:url(#stream);animation:none}
.confluence .fine{stroke-width:1.3;opacity:.55}
.confluence .stream-one{animation:riverfloat 7s ease-in-out infinite alternate;transform-origin:center}
.confluence .stream-two{animation:riverfloat 9s ease-in-out infinite alternate-reverse;transform-origin:center}
.confluence .boat-hull{fill:#517b73;stroke:none}
.confluence .boat-mast{stroke:#526d69;stroke-width:1.4}
.confluence .boat-sail{fill:#d7c6a3;stroke:#8c9c8c;stroke-width:.8}
.confluence .small-boat{animation:boatfloat 4.4s ease-in-out infinite}
@keyframes riverfloat{from{transform:translateY(-5px)}to{transform:translateY(6px)}}
@keyframes boatfloat{0%,100%{transform:translate(619px,86px) rotate(-3deg)}50%{transform:translate(619px,82px) rotate(3deg)}}
.video-box .video-meta{font-size:11px;letter-spacing:.09em}
.archive-nav{position:fixed;right:30px;bottom:26px;z-index:500;display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.nav-toggle{padding:12px 16px;border:1px solid #acc2b1;color:#294f3a;background:#f3f0e9ef;box-shadow:0 7px 22px #243d341a;cursor:pointer;font:12px 'Courier New',monospace;letter-spacing:.12em}

.nav-links[hidden]{display:none}
.nav-links a{display:block;padding:10px 19px;color:#274b39;text-decoration:none;font:12px 'Courier New',monospace}
.nav-links a:hover{background:#e1e9df}
.contributors{display:block;margin-top:10px;color:#6b746b}
.story-quote{user-select:text}
@media(max-width:850px){.opening>.prose{display:block}.opening>.prose p{margin-bottom:27px}.opening>.prose p:first-child{font-size:21px}.opening{padding-top:92px}.opening .origin blockquote{font-size:clamp(32px,8vw,52px)}.archive-nav{right:14px;bottom:14px}.confluence{height:115px}.method{grid-template-columns:1fr}.chapter .info{width:100%}.chapter{padding-top:66px;padding-bottom:66px}}

.opening .origin blockquote:after{content:'”';display:inline;color:#a8c2af;font-size:.9em;line-height:0;margin-left:.06em;vertical-align:-.13em}

<section class="content"><div aria-hidden="true" class="confluence"><canvas aria-label="Движущиеся линии волн и бумажный кораблик" id="river-transition" role="img"></canvas></div><div class="section-title" id="videoart"><div><div class="eyebrow" data-i="vidtag"></div><h2 data-i="vidtitle"></h2></div></div><div class="videos"><article class="video-box"><video controls="" data-file="danube_fr_1.mp4" playsinline="" preload="metadata" src="rivers/danube_fr_1.mp4"></video><div class="video-meta"><span class="video-city" data-en="Danube" data-ru="Дунай" data-sr="Dunav">Дунай</span><span class="video-author" data-en="Anna Frantsuzova, Katarina Čokrlić" data-ru="Анна Французова, Катарина Чокрлич" data-sr="Ana Francuzova, Katarina Čokrlić">Анна Французова, Катарина Чокрлич</span></div></article><article class="video-box"><video controls="" data-file="AIMS_Video_Danube.mp4" playsinline="" preload="metadata" src="rivers/AIMS_Video_Danube.mp4"></video><div class="video-meta"><span class="video-city" data-en="Danube" data-ru="Дунай" data-sr="Dunav">Дунай</span><span class="video-author" data-en="Tijana Jevrić" data-ru="Тияна Йеврич" data-sr="Tijana Jevrić">Тияна Йеврич</span></div></article><article class="video-box"><video controls="" data-file="spb_fr_2.mp4" playsinline="" preload="metadata" src="rivers/spb_fr_2.mp4"></video><div class="video-meta"><span class="video-city" data-en="Neva" data-ru="Нева" data-sr="Neva">Нева</span><span class="video-author" data-en="Anna Frantsuzova" data-ru="Анна Французова" data-sr="Ana Francuzova">Анна Французова</span></div></article><article class="video-box"><video controls="" data-file="AIMS_Video_Neva.mp4" playsinline="" preload="metadata" src="rivers/AIMS_Video_Neva.mp4"></video><div class="video-meta"><span class="video-city" data-en="Neva" data-ru="Нева" data-sr="Neva">Нева</span><span class="video-author" data-en="Tijana Jevrić" data-ru="Тияна Йеврич" data-sr="Tijana Jevrić">Тияна Йеврич</span></div></article></div><div class="section-title" id="stories"><div><div class="eyebrow" data-i="histag"></div><h2 data-i="histitle"></h2></div><span class="mono">14 / VOICES</span></div><div class="story-filter"><button class="active" data-filter="all"></button><button data-filter="danube"></button><button data-filter="neva"></button></div><p class="translation-note" data-i="note"></p><div class="storygrid" id="storygrid"></div></section></main><div class="hud" id="hud"><span id="percent">000%</span><div class="line"><div class="fill" id="progress"></div></div><span id="hudtitle"></span></div><nav aria-label="Сцены" class="dots" id="dots"></nav><footer class="foot"><div class="foot-line"><span data-i="foot"></span> · АННА ФРАНЦУЗОВА · ИРИНА МАМОНОВА · КАТАРИНА ЧОКРЛИЧ</div><div class="foot-line participants-line"><span data-i="participants"></span></div><div class="foot-line launch-line"><span data-i="launched"></span></div></footer><script id="model" type="application/json">{"archive":{"stories":[{"id":"story-1","city":"danube","title":"Август 2007 года, Нови-Сад","text":"Август 2007 года, Нови-Сад\n\nВ лодке – две француженки, двое французов, друг отца, отец и я. С французами я познакомилась тем же утром совершенно случайно и пригласила их прокатиться по Дунаю.\n\nГде-то после острова Рибарски, вверх по течению, в сторону Каменяра, двигатель (знаменитый Penta Tomos 4) заглох. Отец попытался завести двигатель, потом друг отца, затем и я. Французы тоже подключились. У нас ничего не получилось, мы прыгнули в воду.\n\n«А вот сейчас переведи…», – сказал папа, – «Нам придётся плыть обратно!»\n\nК счастью, мы плывём вниз по течению.","author":"Анонимно","sr":"Avgust 2007, Novi Sad\n\nU čamcu su dve Francuskinje, dva Francuza, tatin prijatelj, tata i ja. Francuze sam tog jutra upoznala sasvim slučajno i pozvala ih da se provozaju Dunavom. Negde posle Ribarskog ostrva, uzvodno ka Kamenjaru, motor (čuvena Penta Tomos 4) se gasi. Tata pokušava da upali motor, poku[ava i prijatelj pa ja. Pridružuju se i Francuzi. Ne uspevamo, uskačemo u vodu.\n\n„Prevedi sad... moraćemo da plivamo nazad!“\n\nSrećom, plivamo nizvodno.","en":"August 2007, Novi Sad\n\nThere are two French women, two French men, my father's friend, my father and me in the boat. I met the French people by chance that morning and invited them on a trip along the Danube.\n\nSomewhere past Ribarsko Island, going upstream towards Kamenjar, our engine (the famous Penta Tomos 4) stops. Dad tries to start it, then his friend, then me. The French join in. Nothing works, so we jump into the water.\n\n“Now translate this,” Dad says. “We'll have to swim back!”\n\nLuckily, we are swimming downstream.","original_lang":"sr"},{"id":"story-2","city":"danube","title":"Шлёп… плюх!","text":"Шлёп… плюх! … тик, тик…. Шлёёп…\n\nКогда буксир и баржа проходят мимо, шлёп намного длиннее, потому что волна, которая омывает берег, немного больше, за ней следуют несколько подобных.\n\nС моста нужно спуститься к побережью со стороны Петроварадина, сразу направо.\n\nНизкие деревья, большие кустарники. При низком уровне воды между ними и рекой остаётся немного места для берега.\n\nЗаберись туда с книгой и чем-нибудь, на чём можно посидеть; может быть, захвати бутерброд:) ...\n\nТы видишь и набережную, и город, кишащий жизнью и шумом. Но это где-то там, по ту сторону спокойной и бурной воды.\n\nИ мост издаёт звуки... но где-то там, наверху.\n\nТы слышишь всё, но тебя окружает тишина.\n\nШлёп...\n\nПлюх слышен, когда шлепы сталкиваются… Ты прислушиваешься к ритму, но его нет: каждая маленькая волна издаёт свой собственный звук.\n\nКнигу надо выбрать правильно, так чтобы она вписывалась в природу, не обременённую намерениями. Ты чувствуешь, когда книга не та, и в следующий раз берёшь другую, если эта действительно не умеет молчать.\n\nИ часы сливаются в одно мгновение, пока солнце бесшумно опускается через левое плечо в равнину или вверх по течению в Дунай. Что же там, за городом, и шумом, который ты слышишь все слабее и слабее между шлёп… плюх... тик, тик... шлёёп.","author":"Сладжана Стоя","sr":"Šlaap... buć! ... tok, tok.... Šlaaaap...\n\nKad prođu šleper i barža onda je šljaaap mnogo duži jer je i talasić koji zapljuskuje obalu malo krupniji, praćen je nekolicinom sličnih.\n\nS mosta siđeš na samu obalu sa petrovaradinske strane, tu odmah na desno.\n\nNisko drveće, više šipražje,  pri niskom vodostaju ostavljaju nešto obale.\n\nTu se zavući sa knjigom, i nečim na šta može da se sedne,  može sendvič :) ...\n\nVidiš ti kej, vrvi životom i bukom grada. Ali on je tamo preko - preko mirne a snažne vode.\n\nI most donosi zvukove... ali tamo negde gore.\n\nSve čuješ, a oko tebe tišina.\n\nŠlaap ...\n\nBuć se čuje - kad se šljapovi sudare ... Osluškuješ ritam - a nema ga, svaki talasić pravi šum za svoj groš.\n\nKnjigu moraš pravilno da izabereš - da se uklopi u prirodu neopterećenu namerom. Osetiš kad nije ta,  pa je za drugi put promeniš,  ako baš ne ume da ćuti.\n\nI sati se sliju u trenutak, dok se sunce preko levog ramena bešumno spušta u ravnicu, ili u Dunav uzvodno - šta li je već tamo preko, za gradom, i šūmom kojeg čuješ sve slabije između šljap... buć... tok, tok ... šlaaaap.","en":"Splash... plop! ... tap, tap... splaaash...\n\nWhen a tugboat and a barge pass, the splash lasts much longer because the little wave washing against the bank is bigger, followed by a few more waves like it.\n\nGo down from the bridge to the bank on the Petrovaradin side, then turn right. Low trees and thick bushes leave a little strip of shore when the water is low.\n\nHide there with a book and something to sit on, maybe a sandwich too :)\n\nYou can see the quay, full of city life and noise. But it is over there, across the calm yet powerful water. The bridge brings you sounds too, but they come from somewhere high above.\n\nYou hear everything, yet all around you there is silence.\n\nSplash...\n\nYou hear a plop when two splashes meet. You listen for a rhythm, but there isn't one. Every small wave makes its own sound.\n\nChoose your book carefully. It has to belong in nature, which has no plans or intentions. You can feel when it is the wrong book, and next time you bring another one, if this one really cannot keep quiet.\n\nAnd hours melt into a single moment as the sun silently sinks over your left shoulder, into the plain or into the Danube upstream. What is out there, beyond the city? You hear its noise less and less between splash... plop... tap, tap... splaaash.","original_lang":"sr"},{"id":"story-3","city":"danube","title":"Дунайская медитация","text":"Пляж Штранд, каждый день с мая по октябрь, утро\n\nДунайская медитация.\n\nЯ стою в воде, смотрю в сторону Рыбацкого острова. Дунай в этом месте движется странно, как будто я нахожусь на пересечении трех границ... он течет от Дунаваца вниз по течению, но иногда навстречу приходит волна. Поверхность воды выглядит как блёстки. Я не двигаюсь, мне даже не нужно плавать. В этом месте все мои проблемы исчезают на пять минут.","author":"Анонимно","sr":"Špic, Štrand, svaki dan od maja do oktobra, jutro\n\nDunavska meditacija.\n\nStojim u vodi, gledam u pravcu Ribarskog ostrva. Dunav na ovom mestu ima čudno kretanje, kao da se nalazim na tromeđi... teče iz Dunavca, nizvodno i bude tu još poneki talas. Površina vode izgleda kao da je na šljokice. Ne pomeram se, ne moram čak ni da plivam. Na ovom mestu na pet minuta nestaju svi problemi.”","en":"Štrand Beach, every morning from May to October\n\nDanube meditation.\n\nI stand in the water, looking towards Fishermen's Island. The Danube moves in a strange way here, as though I were standing where three borders meet. Water flows out of the Dunavac and downstream, but sometimes a wave comes back towards me. The surface sparkles like glitter. I don't move. I don't even have to swim. For five minutes, all my problems disappear.","original_lang":"sr"},{"id":"story-4","city":"danube","title":"Платформа","text":"У Дуная есть и тихая часть – место, где вода почти не течёт, будто стоит неподвижно и несет на своей спине сотни лодок и судьбу десятков плавучих домов. Его спокойствие привлекает людей, которые хотят сбежать от скорости жизни и постоянной погони за разными вещами. Однако, если ты ребенок и ищешь только веселья и соблазнов, Дунавац – идеальное место и для этого. Помню лето 2000 года: тогда я закончил седьмой класс, и все каникулы проводил у реки с компанией ребят. Ребята с Четвёртого Лимана были здесь местными, но и наших с Грбавицы хватало. Там, на Дунаваце, стояли какие-то опоры – я даже не знаю, от чего они остались, но мы называли их Платформой. Мы туда залезали и прыгали: кто-то с нижней части, а кто посмелее – с верхней. Почему-то никто не выделялся своей смелостью, или, если смотреть на это с другой точки зрения, скорее своим безумством, потому все прыжки были похожими. Ладно, прыжок вниз головой был немного экстремальнее, но и это многим удавалось. Так продолжалось до тех пор, пока однажды Филипу, а кому же еще, не пришла в голову беспрецедентная идея. Он перелез через дерево, растущее вдоль платформы, на верхний этаж, и, кажется, Куб каким-то образом умудрился помочь Филипу поднять и велосипед. Помню, это был велосипед типа «Поника», может быть, даже украденный, но идеально подходящий для того, что он задумал. Он разогнался на этом велосипеде и прыгнул в Дунай… он жив. И даже велик уцелел, Филип вытащил его из воды. Просто незабываемо!","author":"Бранимир Пилипович","sr":"Dunav ima i svoj miran deo, jedno parče koje ne teče, mirno stoji i nosi na svojim ledjima na stotine čamaca i destine plutajucih kućica. Svojom smirenošću privlači ljude koji žele da pobegnu od brzine životnog ritma i stalnog trčanja za raznim stvarima. Medjutim, kada si dete i tražis samo zabavu i iskušenja, Dunavac je savršeno mesto i za to. Sećam se leta davne 2000, kada sam završio sedmi razred, i sa društvom na raspustu dane provodio uz reku. Tu na Dunavcu su bili stubovi, ni ne znam od čega je to ostalo, ali mi smo ih zvali Platforma. Skakanje sa platforme je bilo nešto posebno. Limanci sa četvorke su bili domaći ali nije manjkalo ni naše ekipe sa Grbavice. Pentrali bismo se, skakali, neki sa donjeg sprata, a oni hrabriji sa gornjeg. Nekako niko nije uspevao da se izdvoji svojom hrabrošću, ili sada iz ove perspektive možda bolje rečeno ludošću, jer su svi skokovi bili slični. Ok, skok na glavu je bio malo ekstremniji ali mnogo njih je uspevalo u tome. I tako je bilo sve do jednog dana dok Filipu, a kome bi drugom, nije palo na pamet da uradi nešto nevidjeno. Popeo se preko drveta koje je raslo uz platformu na gornji sprat, a cini me Kocka mu je nekako popeo i bicikl. Sećam se da je to bila neka ponika, možda čak i ukradena, ali savršena za ono što je smislio. Zaleteo se na toj poniki i skočio u Dunav... živ je. I ponika je čak ostala čitava i izvukao ju je napolje. Jednostavno nezaboravno!","en":"The Danube has a quiet part too, a place where the water hardly flows. It seems to stand still, carrying hundreds of boats and dozens of floating houses on its back. Its calm draws people who want to escape the speed of life and the constant chase after things. But when you are a child and all you want is fun and adventure, the Dunavac is perfect for that too.\n\nI remember the summer of 2000. I had just finished seventh grade and spent my holidays by the river with a group of friends. The boys from Liman Four were the locals, but there were plenty of us from Grbavica as well.\n\nThere were some old supports in the Dunavac. I don't even know what they used to hold up, but we called them the Platform. We climbed up and jumped into the water. Some jumped from the lower level, the braver ones from the upper level. Somehow nobody stood out for their courage, or perhaps, looking back, for their madness. All the jumps were much the same. All right, diving headfirst was more extreme, but lots of people managed it.\n\nThen one day Filip, who else, had an idea nobody had ever tried. He climbed a tree growing beside the Platform to reach the upper level. I think Kocka somehow helped him lift a bicycle up there too. I remember it was a little Pony bike, perhaps even stolen, but just right for what Filip had in mind.\n\nHe took a run at it on that bike and jumped into the Danube. He survived! Even the bicycle was fine. Filip pulled it out of the water. Simply unforgettable!","original_lang":"sr"},{"id":"story-5","city":"danube","title":"Лето на Штранде","text":"Лето 2016 года, солнце освещает самый красивый для меня пляж на Дунае, – Штранд. Как и каждый летний день, когда у меня есть возможность, я играю в теннис головой – спорт, придуманный в Нови-Саде, – а после партии прыгаю в воду, чтобы охладиться и смыть песок с головы. В тот момент время течёт медленнее. Тело сливается с охлаждающей меня водой, и в голове проносится мысль: «Как прекрасна жизнь». Тогда я понимаю, как мало нужно для счастья, и что именно такие моменты по-настоящему наполняют меня духовно.","author":"Анонимно","sr":"Leto, 2016, sunce obasjava za mene najlepsu plazu na Dunavu - Strand. Kao i svaki letnji dan kada sam u mogucnosti, igram autenticni novosadski sport - tenis glavom, a nakon zavrsene partije uskacem u vodu kako bih se rashladio i ocistio pesak sa glave. U tom momentu, vreme tece sporije. Telo se stapa sa vodom koja me rashladjuje, a glavom prolazi misao “koliko je zivot lep”. Tada shvatam koliko je malo potrebno za srecu, a da su to trenuci koji me istinski duhovno ispunjavaju.","en":"Summer 2016. The sun shines on Štrand, the most beautiful beach on the Danube, at least to me. Like every summer day when I can, I play head tennis, a sport invented in Novi Sad. After the game, I jump into the water to cool down and wash the sand out of my hair.\n\nIn that moment, time moves more slowly. My body becomes one with the cool water and I think, “Life is beautiful.” Then I understand how little it takes to be happy, and how much these moments mean to me.","original_lang":"sr"},{"id":"story-6","city":"neva","title":"Гроза в Ленинграде","text":"Русский музей, Мойка 12, памятник Петру Первому\n\nЕдинственный раз в Петербурге (тогда в Ленинграде) я был в 1984 году. Мне было 10 лет. Впечатления от города были ошеломляющие: гранитные набережные, дворцы, широкая Нева, корабли, памятники. Но самым сильным впечатлением стала гроза. Мы были в Русском музее, а потом пошли гулять. Началась сильная гроза и мы спрятались у памятника Петру Первому. Я помню тяжелый воздух, мокрый камень, темное небо и ощущение какого-то огромного пространства вокруг. Тогда город показался мне одновременно величественным и немного пугающим.","author":"Анонимно","sr":null,"en":"The Russian Museum, Moika 12, and the monument to Peter the Great\n\nI have only been to Saint Petersburg, then called Leningrad, once. It was 1984 and I was ten years old. The city overwhelmed me: granite embankments, palaces, the wide Neva, ships and monuments. But what I remember most was a thunderstorm.\n\nWe had visited the Russian Museum and then went for a walk. A fierce storm began and we sheltered near the monument to Peter the Great. I remember the heavy air, wet stone, dark sky and the feeling of a huge space around us. At that moment the city seemed both magnificent and a little frightening.","original_lang":"ru"},{"id":"story-7","city":"neva","title":"Мост Александра Невского","text":"Мост Александра Невского\n\nОднажды мы вместе с педагогом театрального института совершили прогулку в сторону моста Александра Невского для того, чтобы запомнить свои физические ощущения. Был осенний вечер, небо темного, бархатного синего цвета, с которым ярко контрастировал теплый свет невысоких уличных фонарей, подсвечивающих редкие желтые листья. Воздух был холодным, густым, плотным, иногда порывами, струями направлялся прямо в лицо. Было в нем что-то морское, почти соленое. Правильнее сказать что-то металлическое – свинцовое. Нева. Мост. Все железное, громадное и величественное. Само ощущение от нахождения на мосту захватывало дух: дуга человеческой мысли над степенной, но сильной стихией. Мы стояли и смотрели. Запоминали, как вела себя река, как ветер обдувал костяшки и теребил нам носы. Вдруг кучка болтунов превратилась в часть пейзажа – будто голуби расселись по перилам моста – так держались мы за них. Вдоволь надышавшись, мы отправились в обратный путь, неся в себе этот неповторимый образ.","author":"Анонимно","sr":null,"en":"Alexander Nevsky Bridge\n\nOnce, a group of us went for a walk towards Alexander Nevsky Bridge with a teacher from the theatre institute. We wanted to remember how the place felt in our bodies.\n\nIt was an autumn evening. The sky was a deep, velvety blue. The warm light from the low street lamps stood out against it, lighting up a few yellow leaves. The air was cold, thick and heavy. Sometimes a gust blew straight into our faces. There was something of the sea in it, almost salty. Or rather, something metallic, like lead.\n\nThe Neva. The bridge. Everything made of iron, huge and majestic. Standing on the bridge took my breath away. It was an arc of human thought above the calm but powerful force of nature.\n\nWe stood and watched. We tried to remember how the river moved, how the wind blew over our knuckles and tugged at our noses. Suddenly our little group of chatterboxes became part of the view. We clung to the railing like pigeons sitting in a row.\n\nAfter breathing in enough of that air, we walked back, carrying this one unforgettable image with us.","original_lang":"ru"},{"id":"story-8","city":"neva","title":"У Невы","text":"Пристань – от Благовещенского моста в сторону Финского залива\n\nВ этом городе прошло становление моей личности, если можно так сказать. Каждый момент – отдельная история. Каждый шаг, каждый метр что-то в себе таит. Где-то я влюблялась, где-то мне разбивали сердце, где-то я была счастлива, обнимая дорогого сердцу человека, где-то я разочаровывалась в себе, где-то смеялась, где-то плакала, где-то бежала навстречу старому знакомому, где-то знакомилась и гуляла всю ночь, пока мосты не сведут. Я очень люблю замечать красоту этого города, его величие, но начала я это делать не сразу, а только в тот момент, когда поняла, что скоро могу уехать и не смогу любоваться этой красотой каждый день. Какой меня Петербург только не видел…, но он всегда был очень добр ко мне! И я ему безмерно благодарна!\n\nЕсть одно место, куда я прихожу, когда не знаю, куда дальше идти, какое решение принять… к воде! (А именно – на одну из пристаней).\n\nВода – удивительная вещь! Она будто знает на все ответы… (конечно же, знаю их я, в глубине души, а она помогает успокоиться и вытащить их наружу, прислушаться к зову своего сердца, замедлиться). Я всегда прихожу к берегам Невы в сложные моменты. Стою очень долго, думаю, всматриваясь в её глубину, иногда плачу. Нева очищает, бережно смывая ненужные страхи, и ты стоишь, будто обнаженный, окутанный ветрами со всех сторон, дышишь свободой и все твои печали, радости, переживания Нева разделяет вместе с тобой. Она будто говорит: «не бойся, я рядом, я приму тебя таким, какой ты есть» – и ты высказываешься, делишься самым сокровенным, трепетным… Она понимает тебя, обнимает, подмигивает тебе своими бликами, говоря: «ты не один! Справимся!». И ты ей веришь, потому что сила этой стихии безгранична, ты ощущаешь ее, даже не прикасаясь. Удивительно, а ведь город ею окружен!\n\nКогда заходит солнце, у воды особенно прекрасно! В дни, когда особенно тяжело, Питер дарит мне самые красивые закаты. Я думаю, что так он проявляет свою любовь ко мне (я же, в свою очередь, отвечаю ему взаимностью).\n\nМне нужно было принять решение касательно моей профессии, от которого очень многое зависело. Я была в полной растерянности, не знала с кем советоваться, куда деть свой поток мыслей и информации, которая меня окружала. В тот день я очень долго сидела у воды, говорила с ней, укутываясь шарфом, пила остывший чай, а рядом со мной сидела дворовая собачка, которая тоже делилась с Невой чем-то своим… вода нас свела в тот вечер, два одиночества, которым очень нужно было высказаться тому, кому высказаться не страшно. Мы долго сидели с ней, а потом разошлись в разных направлениях, я думаю, мы нашли друг в друге поддержку, и ответили на свои вопросы. (Нева – это тоже своеобразный друг, который всегда выслушает и не осудит. Нужно быть к ней благодарной!)","author":"Анонимно","sr":null,"en":"A landing stage, from Blagoveshchensky Bridge towards the Gulf of Finland\n\nI became the person I am in this city, if I can put it that way. Every moment has its own story. Every step, every metre holds something. Somewhere I fell in love. Somewhere my heart was broken. Somewhere I was happy, holding someone dear to me. Somewhere I was disappointed in myself, laughed, cried, ran to meet an old friend, met someone new and walked all night until the bridges came down again.\n\nI love noticing the beauty and grandeur of Saint Petersburg. But I didn't always notice it. I started only when I realised I might soon leave and would no longer be able to enjoy it every day. Petersburg has seen me in every possible state, but it has always been kind to me. I am so grateful to it!\n\nThere is one place I go when I don't know where to go next or what decision to make: the water. More exactly, one of the landing stages.\n\nWater is a wonderful thing. It seems to know all the answers. Of course, deep down I know them myself. The water helps me calm down, find those answers, listen to my heart and slow down.\n\nWhenever life is difficult, I come to the banks of the Neva. I stand there for a long time, thinking, looking into the depths, sometimes crying. The Neva cleanses me. It gently washes away fears I no longer need. You stand there, almost bare, wrapped in wind on every side, and breathe freely. The Neva shares all your sadness, happiness and worries.\n\nIt seems to say, “Don't be afraid. I'm here. I'll accept you just as you are.” And you speak to it, sharing the most private and tender things. It understands, holds you and winks with its reflections: “You're not alone. We'll get through this.” You believe it because the river's power has no limits. You can feel it without even touching the water. And the whole city is surrounded by it!\n\nThe water is especially beautiful at sunset. On the hardest days, Petersburg gives me the loveliest sunsets. I think that is how the city shows me its love, and I love it back.\n\nOne day I had to make a decision about my career. So much depended on it. I was completely lost. I didn't know whom to ask for advice or what to do with all the thoughts and information in my head.\n\nThat day I sat by the water for a very long time. I talked to it, wrapped myself in my scarf and drank tea that had gone cold. A stray dog sat beside me. She was telling the Neva something of her own. That evening the water had brought together two lonely souls who needed to talk to someone they were not afraid of.\n\nWe sat together for a long time, then went our separate ways. I think we supported each other and found answers to our questions. The Neva is a kind of friend too. It always listens and never judges. We should be grateful to it!","original_lang":"ru"},{"id":"story-9","city":"neva","title":"Прогулка по Неве","text":"Прогулка по Неве\n\nЭкскурсия по Неве. Работала я в частной фирме. Начальник был замечательный человек и однажды организовал для сотрудников прогулку по Неве на теплоходе. Был теплый вечер, вода отражала огни города, и Петербург казался особенно красивым и спокойным. Помню ощущение легкости и какого-то редкого счастья от того, что можно просто смотреть на воду и город вокруг.","author":"Анонимно","sr":null,"en":"A boat trip on the Neva\n\nI worked at a private company. My boss was a wonderful person. One day he arranged a boat trip on the Neva for the staff. It was a warm evening. The water reflected the city lights, and Saint Petersburg seemed especially beautiful and peaceful. I remember feeling light, and a rare kind of happiness, simply looking at the water and the city around me.","original_lang":"ru"},{"id":"story-10","city":"neva","title":"Погладить город по спине","text":"Вечер очень жаркого летнего дня, часов восемь, к девяти, долгий закат. Оказавшись в такое время на набережной Невы между Троицким и Дворцовым мостами, я вспоминаю первые страницы «Санкт-Петербургских вечеров» Жозефа де Местра. Это началось больше двадцати лет назад, но неизменно повторяется. И всегда что-то происходит со временем – оно как бы расслаивается: сквозь вид сегодняшней Невы просвечивает тот же вид в июне 1809 года, когда начинается рассказ де Местра. Среди шустрых современных прогулочных корабликов и суетливых катеров напротив Зимнего дворца видится старинная лодка с тремя пассажирами, поднимающаяся вверх по реке размеренными усилиями гребцов. Внятно слышится голос, описывающий как солнце медленно, будто бы с сожалением покидает землю, как солнечный диск в огненном нимбе катится по небу подобно красно-оранжевой колеснице, как солнечные лучи пожаром горят в отражении окон дворцов.\n\nЛетним вечером 2010 года всё повторилось: медленно против течения двигалась лодка, медленно и тихо звучал голос, медленно закатывалось солнце. В тот вечер прогулка по набережной Невы от Троицкого к Дворцовому мосту оказалась особенно неспешной и бесцельной, с длинными остановками, чтобы перегнуться через парапет и зависнуть, вглядываясь в воду. Невская вода под заходящим западным солнцем – расплавленное золотое масло. Редкий случай, когда река не мечется, как больной в своей беспокойной постели, не гудит, не шумит, не ревет, а мягко льнет к каменным берегам и тихо-тихо лепечет.\n\nПервая длинная остановка напротив Мраморного дворца. Наклоняюсь к воде, руки ложатся на шершавый, прогретый солнцем гранитный парапет и я вдруг ощущаю, что это вовсе не камень, а грубая теплая шкура какого-то огромного живого существа вроде фантастического морского дракона – это и есть мой город. Его гигантское тело погружено в золотую теплую воду, из воды выступает только спина, хребет – его-то я и глажу, пока он, разнежившись на солнце, эту вольность мне позволяет. Кажется, что он чувствует мое микроскопическое прикосновение и ему человеческая ласка приятна.\n\nС тех пор прогулки по набережной Невы связаны для меня с двумя этими переживаниями. Я стараюсь время от времени прийти сюда летним вечером, увидеть лодку, услышать голос и в том самом месте напротив Мраморного дворца повторить стихийно возникший ритуал – погладить город по спине и пошептать ему какие-нибудь нежности.","author":"Анонимно","sr":null,"en":"Stroking the city on its back\n\nIt is the evening of a very hot summer day, around eight or nine, with a long sunset. When I find myself on the Neva embankment between Trinity Bridge and Palace Bridge at this hour, I remember the opening pages of Joseph de Maistre's “Saint Petersburg Dialogues.” It began more than twenty years ago and has happened ever since.\n\nSomething always happens to time. It seems to form layers. Through today's view of the Neva I can see that same view in June 1809, when de Maistre's story begins. Among the quick modern tourist boats and busy little launches opposite the Winter Palace, I can imagine an old boat with three passengers, moving upstream with the steady work of its rowers. I can almost hear a voice describing how the sun slowly, almost sadly, leaves the earth. The sun, glowing like fire, rolls across the sky like a red and orange chariot. Its rays set the palace windows ablaze with reflected light.\n\nOn a summer evening in 2010 it all happened again. A boat moved slowly against the current. The voice sounded softly and slowly. The sun set slowly. My walk along the Neva from Trinity Bridge to Palace Bridge was unusually unhurried and without a destination. I kept stopping to lean over the stone railing and stare into the water.\n\nUnder the western sunset, the water of the Neva looked like melted golden butter. It was one of those rare moments when the river did not toss like a sick person in a restless bed. It did not hum, roar or rush. It rested against its stone banks and murmured very quietly.\n\nMy first long stop was opposite the Marble Palace. I bent towards the water and placed my hands on the rough granite railing, warm from the sun. Suddenly I felt that it was not stone at all. It was the rough, warm skin of a huge living creature, something like a fantastic sea dragon. That creature was my city.\n\nIts enormous body lay in the warm golden water. Only its back, its spine, rose above the surface. I was stroking that back while the creature, relaxed in the sun, allowed me to do so. It seemed to feel my tiny touch, and to enjoy this bit of human affection.\n\nSince then, my walks along the Neva have held these two experiences together. From time to time I try to come back on a summer evening, see the boat, hear the voice and stop at the same place opposite the Marble Palace. There I repeat the little ritual that came to me by chance. I stroke the city on its back and whisper something tender to it.","original_lang":"ru"},{"id":"story-11","city":"neva","title":"Нева сквозь время","text":"Я родился в Ленинграде в 1937 году и провел всю жизнь в городе на Неве. С детства река была для меня не просто частью городского пейзажа, а постоянным свидетелем жизни – блокадной, послевоенной, мирной. Мне есть что вспомнить.\n\nВсё, что было до Великой Отечественной войны, в памяти стерто – по-видимому, Ленинградской блокадой, которую мы с бабушкой пережили в полупустой коммунальной квартире на Невском проспекте. Мама работала на заводе и была на казарменном положении, отец был на Ленинградском фронте.\n\nИ вот победа! 27 января 1944 года – снятие Блокады!!! И грандиозный салют с фейерверком около Петропавловской крепости. Мы с бабушкой смотрим на него, расположившись у стен Эрмитажа. Незабываемое событие: первые мирные залпы за многие годы. И необыкновенно много, непривычно много людей вокруг. Часть из них вышла на лед Невы и догорающие разноцветные ракеты падали среди людей, вызывая возгласы восторга. Одному мужчине ракета упала на шапку, но и это вызвало взрыв смеха и радости, поскольку обошлось без травм… А мощный салют продолжался, причём с такой силой, что несколько стёкол из окон Эрмитажа вылетело со звоном. Опять же… впервые от мирных залпов, и это тоже было воспринято как оптимистический аккомпанемент!\n\nКстати, о выбитых стеклах... Мы жили на Невском проспекте, и примерно за год до снятия Блокады произошел такой эпизод. Середина дня, мы с бабушкой сидим в комнате, залитой солнцем. Она вяжет шерстяные носки для бойцов на фронте: была так называемой «надомницей». В какой-то момент бабушка попросила меня принести сантиметр, лежащий на подоконнике. Я отошел от окна секунд за десять до того, как в дом напротив попал снаряд. От взрывной волны у нас не осталось ни одного целого стекла, а осколками была усыпана половина комнаты. Повезло, что она была большая и мы находились в дальней от окна части.\n\nИ еще о блокаде. Летом 1943 года у нашей семьи был огород в сквере между Домом политкаторжан и Троицким мостом, недалеко от Петропавловской крепости. Поливали огород водой из Невы. Во время обстрелов мы с бабушкой прятались под аркой дома. Однажды, вернувшись, увидели побитые осколками кочаны капусты.\n\nА теперь эпизоды из мирного времени… Я начал учиться в школе в год снятия блокады, а окончил ее в 1954 году. После некоторых раздумий поступил на физический факультет Ленинградского государственного университета, который тогда располагался в окрестности Стрелки Васильевского острова. Дисциплинированно посещая занятия, я одновременно, практически ежедневно, «окунался» в красоту –  симбиоз архитектуры центра города и Невы! Расскажу о двух сильных впечатлениях.\n\nС 12 по 17 октября 1955 года в Ленинград с первым дружественным визитом прибыла эскадра из шести английских военных кораблей. Среди них был и необычный для наших глаз авианосец. Толпы людей заполнили набережные Невы. Было много взаимно благожелательных контактов с британскими моряками. Жаль, что это не стало традицией.\n\nВизит совпал с одним из самых сильных наводнений в истории города. К вечеру 15 октября вода в Неве поднялась до 293 сантиметров выше ординара. Нева вышла из берегов, затопила набережные в центре города и часть прилегающих улиц. В университете залило всю территорию, включая подвалы в зданиях. До сооружения защитной дамбы тогда было еще очень далеко.\n\nЕще одно яркое воспоминание связано с зимним переходом по льду Невы – от университета до львов на противоположном берегу, около Адмиралтейства. В те годы буксиры еще не ломали лед, чтобы исключить такие рискованные путешествия.\n\nКогда я дошел примерно до середины Невы, меня поразили две вещи. Во-первых, река показалась такой широкой, что стало страшновато. А во-вторых, если шёл по солнышку, открывался очень красивый вид на окружающие здания! И всё это обрамлял сверкающий лёд Невы! Фантастика! Теперь такого не увидишь…","author":"Анонимно","sr":null,"en":"The Neva through time\n\nI was born in Leningrad in 1937 and have spent my whole life in the city on the Neva. Since childhood, the river has been more than part of the city view. It has always been a witness to my life, during the siege, after the war and in peacetime. I have a lot to remember.\n\nEverything before the Great Patriotic War has disappeared from my memory. Perhaps the Siege of Leningrad erased it. My grandmother and I lived through the siege in a half-empty shared apartment on Nevsky Prospekt. My mother worked in a factory and had to live there. My father was serving on the Leningrad Front.\n\nAnd then victory! January 27, 1944, the end of the siege! There was an enormous fireworks display near the Peter and Paul Fortress. My grandmother and I watched it from beside the Hermitage. It was unforgettable: the first peaceful salutes for many years.\n\nThere were so many people, far more than we were used to seeing. Some went out onto the ice of the Neva. The last sparks of coloured rockets fell among them, and people shouted with delight. One rocket even landed on a man's hat. Nobody was hurt, so everyone laughed. The powerful salutes went on, with such force that several windows in the Hermitage shattered. But this time they were broken by peaceful explosions, and even that felt like a sign of hope.\n\nSpeaking of broken windows, something happened at our home on Nevsky Prospekt about a year before the siege ended. It was the middle of the day. My grandmother and I were sitting in a sunlit room. She was knitting woollen socks for the soldiers. This was work she did from home.\n\nAt one point she asked me to bring her a measuring tape from the windowsill. I moved away from the window about ten seconds before a shell hit the building opposite. The blast shattered every window in our apartment. Glass covered half the room. We were lucky that the room was large and we were sitting far from the windows.\n\nAnother memory of the siege: in the summer of 1943 our family had a little vegetable plot in the square between the House of Former Political Prisoners and Trinity Bridge, not far from the Peter and Paul Fortress. We watered the plants with water from the Neva. During shelling my grandmother and I hid under an archway. Once we came back to find our cabbages torn by shrapnel.\n\nNow for some memories of peaceful times. I started school in the year the siege ended and finished in 1954. After thinking it over, I entered the physics department of Leningrad State University. It was then near the eastern tip of Vasilyevsky Island. I went to classes regularly, but almost every day I also immersed myself in the beauty of the city centre, where architecture and the Neva come together. I will tell you about two strong impressions.\n\nFrom October 12 to 17, 1955, a squadron of six British warships visited Leningrad on its first friendly visit. Among them was an aircraft carrier, a strange sight for us. Crowds filled the embankments. There were many warm meetings between local people and British sailors. It is a pity such visits did not become a tradition.\n\nThe visit happened during one of the worst floods in the city's history. By the evening of October 15, the Neva had risen 293 centimetres above its usual level. It overflowed its banks and flooded the central embankments and nearby streets. The university grounds were under water, including the basements. The protective flood barrier was still far in the future.\n\nAnother powerful memory is of walking over the frozen Neva in winter, from the university to the stone lions on the opposite bank near the Admiralty. In those days tugboats did not yet break the ice to prevent such dangerous crossings.\n\nWhen I reached about the middle of the river, two things struck me. First, the Neva seemed so wide that I began to feel afraid. Second, in the sunlight, I had a beautiful view of all the surrounding buildings. Everything was framed by the sparkling ice of the Neva. Fantastic! You cannot see that today.","original_lang":"ru"},{"id":"story-12","city":"neva","title":"Дельфин","text":"Это было 29 сентября 1975 года, во время сильного наводнения в Ленинграде.\n\nЯ тогда учился на философском факультете ЛГУ и в тот день шел после занятий в сторону Невского проспекта. Обычно этот путь был привычным: от университета – к Неве, дальше через мост, в центр. Но в тот день город выглядел иначе.\n\nНаводнение началось рано утром и к середине дня набережные, которые всегда казались прочной границей между городом и рекой, вдруг перестали быть этой границей. Нева поднялась и разлилась. Было ощущение как после сильного дождя: немного беспорядка, немного азарта; люди останавливались, смотрели, переговаривались, показывали друг другу на воду.\n\nОколо Адмиралтейства в то время был ресторан «Дельфин». Это был плавучий ресторан, один из тех, что в Ленинграде привычно называли «поплавками». В обычное время в этом слове было гораздо меньше смысла, чем во время наводнения, когда оно вдруг стало почти буквально описывать происходящее.\n\nПри подъеме воды что-то случилось с причальными канатами: то ли ресторан не успели как следует отпустить от берега, то ли вода слишком быстро прибыла, то ли произошло что-то еще. Но в результате «Дельфин» перекосило и поставило почти вертикально. Он действительно стал похож на огромный поплавок.\n\nЭто было странное и забавное зрелище. А река, которая в юности обычно вызывала в основном поэтические мысли, вдруг показала, что в один момент может нарушить привычный порядок городской жизни. Не разрушить его окончательно, не напугать до ужаса, а именно сбить с места, перевернуть и заставить взглянуть на жизнь с другого ракурса. Как на «поплавок».\n\nЯ постоял немного у воды и пошел дальше, к Невскому.","author":"Анонимно","sr":null,"en":"The Dolphin\n\nIt was September 29, 1975, during a major flood in Leningrad. I was studying philosophy at Leningrad State University. That day I was walking from class towards Nevsky Prospekt. Normally it was a familiar route: from the university to the Neva, over the bridge and into the centre. But that day the city looked different.\n\nThe flood began early in the morning. By midday, the embankments, which had always seemed to mark a firm border between the city and the river, were no longer a border. The Neva had risen and spilled over. There was a feeling like the aftermath of heavy rain: a little disorder, a little excitement. People stopped, watched, talked and pointed at the water.\n\nNear the Admiralty there was a restaurant called the Dolphin. It was a floating restaurant, one of the places people in Leningrad called “floats.” Normally the word was just a nickname. During the flood it became almost literal.\n\nSomething happened to the mooring ropes as the water rose. Perhaps there was no time to loosen them, perhaps the water rose too quickly, or perhaps something else happened. In the end the Dolphin tilted and stood almost upright. It really did look like a giant float.\n\nIt was a strange and funny sight. The river, which had usually inspired poetic thoughts in my youth, suddenly showed how easily it could upset the ordinary order of city life. Not destroy it or terrify us, but turn it upside down and make us see life from a different angle. Like that “float.”\n\nI stood by the water for a while and went on towards Nevsky.","original_lang":"ru"},{"id":"story-13","city":"neva","title":"Театральный бинокль","text":"В детстве мне казалось, что к театру не просто приходят, а будто подплывают: автобусы и трамваи двигались через город, и мне было весело ловить отражение этого движения в каналах. Когда я была маленькой, бабушка и дедушка иногда брали меня с собой в Кировский театр. За полчаса дороги можно было пересечь несколько мостов и увидеть совершенно разный ритм водной глади. Для меня поход в театр всегда был событием: большой зал, люстры, удивительный занавес и звуки оркестра, который настраивался перед началом спектакля.\n\nУ бабушки всегда был с собой театральный бинокль. Тогда у многих зрителей были похожие бинокли, и примерно такие же можно было взять и прямо в театре. Он вызывал ощущение старинной и очень загадочной вещи: тяжёлый, прохладный, немного потёртый. Кажется, у него был свой едва уловимый запах. Возможно, так пахла латунь, перламутр или старая смазка механизма. Но мне казалось, что так пахнет сам театр: старинные канделябры, футляры, бархат лож, духи... Словом, этот запах был олицетворением всего того, что разрушало границы времени и пространства и делало театр входом в другой, прячущийся на страницах романов мир.\n\nВ детстве мне казалось, что это не просто бинокль, а настоящий ключ в волшебный мир. Стоило приложить его к глазам и всё происходящее на сцене становилось реальностью. Балерины превращались в фей и принцесс. Жар Птица впечатляла реальностью своего существования…\n\nБабушка рассказывала, что этот бинокль принадлежал её маме. Вроде бы, она привезла его из Парижа незадолго до революции. Потом многое изменилось. Исчезли квартиры, привычный уклад жизни, многие вещи и фотографии. А бинокль каким-то чудом сохранился. Он снова нашёлся уже после моего рождения, среди старых коробок и вещей, когда разбирали антресоли. Это было в середине 90-х, когда семья переезжала на новую квартиру.\n\nС того времени, как я вертела бинокль в детстве прошло очень много времени. Теперь, когда я беру его в руки, вспоминаю театр – мой театр, тот театр. И бабушку с дедушкой рядом. Для меня этот бинокль – друг, который сохранил память о времени, когда для ощущения чуда было достаточно услышать гул зрительного зала и первые звуки настраивающегося оркестра.","author":"Анонимно","sr":null,"en":"The opera glasses\n\nWhen I was a child, I felt that people did not simply arrive at the theatre. They almost sailed there. Buses and trams crossed the city and I loved catching their reflections in the canals. When I was little, my grandparents sometimes took me to the Kirov Theatre. During the half-hour journey we crossed several bridges and saw the water moving in many different ways. A visit to the theatre was always a special event: the big auditorium, the chandeliers, the wonderful curtain and the sound of the orchestra tuning up before the performance.\n\nMy grandmother always carried a pair of opera glasses. Many people had similar glasses then, and you could also borrow them at the theatre. They felt like something old and mysterious: heavy, cool and a little worn. They seemed to have a very faint smell of their own. Perhaps it was brass, mother of pearl or the old oil inside the mechanism. But to me it was the smell of the theatre itself: old chandeliers, cases, velvet boxes, perfume.\n\nIt was the smell of everything that broke through the borders of time and space and made the theatre a doorway into another world, the kind hidden in novels.\n\nAs a child I thought those glasses were not just opera glasses, but a real key to a magical world. All I had to do was raise them to my eyes and everything on stage became real. Ballerinas turned into fairies and princesses. The Firebird seemed to truly exist.\n\nMy grandmother told me that the glasses had belonged to her mother. She apparently brought them back from Paris shortly before the revolution. Then many things changed. Apartments, familiar ways of life, objects and photographs disappeared. But somehow the opera glasses survived.\n\nThey were found again after I was born, among old boxes and possessions when the family was clearing out the storage shelves. That was in the mid-1990s, when we were moving to a new apartment.\n\nA very long time has passed since I played with those glasses as a child. Now, when I hold them, I remember the theatre. My theatre, that theatre. And my grandparents beside me. To me, the glasses are a friend that has kept the memory of a time when all it took to feel a little magic was the sound of the audience in the hall and the first notes of the orchestra tuning up.","original_lang":"ru"},{"id":"story-14","city":"danube","title":"Бескрайняя синева","text":"Лодка брата спокойно плыла по каналу, ведущему из Костолаца. Рядом зелень, дома. Канал неширокий, поэтому левый и правый берега были близко ко мне. День был наполнен впечатлениями, поэтому сейчас я замечаю лишь половину деталей, а половина проходит мимо! Нам остается только выйти в Дунай и медленно вернуться домой вверх по течению.\n\nИ тут, неожиданно, открылась бескрайняя синева.\n\nСиний повсюду, вверху и внизу. Полный круг, сфера. Сверкающий синий.\n\nЯ смотрю на брата, а он улыбается, он-то знает об этом!\n\nВижу рябь: я понимаю, что лодка плывет по Дунаю, но не вижу, чтобы она двигалась.\n\nИ тут, откуда ни возьмись, внезапно раздаются звуки вальса «На прекрасном голубом Дунае» и заполняют все пространство, или только мои уши, или только мой мозг.\n\nЯ их отчетливо слышу… и меня не волнует тот факт, что им некуда взяться – они здесь… и они остаются… И впервые я их понимаю, верю им и наслаждаюсь ими.\n\n…один из немногих образов, что остаются в памяти и уже никуда из неё не уходят.","author":"Анонимно","sr":"Bratovljeva lađica je mirno brektala kanalom koji vodi od Kostolca. Pored su zelenilo, kućice. Kanal nije širok pa su mi blizo Il leva i desna obala. Dan pun utisaka, već polovinu detalja zapažam a polovina mimo prolazi ! Ostalo je da izađemo u Dunav i da se polako uzvodno vratimo kući .\n\nI onda se neočekivano otvorilo beskrajno plavetnilo.\n\nSvuda je plavo i gore i dole. Pun krug, sfera. Plavo koje svetluca .\n\nPogledam brata, on se smeška, on za to zna !\n\nVidim talasiće, jasno mi je da lađica plovi Dunavom, ali ne vidim da se pomera.\n\nI onda, niotkuda, u jedan mah dolaze i pune ili ceo prostor, ili samo moje uši ili samo moj mozak zvuci valcera \"Na lepom plavom Dunavu\".\n\nJasno ih čujem... i ne bavim se time što nemaju odakle da dođu - tu su ... i traju ... I ja ih prvi put razumem, verujem im, i u njima uživam.\n\n... jedna od ne tako mnogo slika koje mi ostaju upamćene, upamćene za svo preostalo vreme.","en":"My brother's little boat moved gently along the canal leading out of Kostolac. There was greenery and there were houses around us. The canal was narrow, so both banks felt close. It had been a day full of impressions. I noticed only half the details, while the rest passed me by. All we had to do was reach the Danube and slowly make our way upstream, back home.\n\nAnd then, suddenly, an endless blue opened before us.\n\nBlue everywhere, above and below. A full circle, a sphere. A blue that shone.\n\nI looked at my brother. He smiled. He already knew.\n\nI could see the little waves. I knew we were moving along the Danube, yet I could not see the boat move.\n\nThen, out of nowhere, all at once, the sounds of the waltz “The Blue Danube” arrived. They filled the whole space, or perhaps just my ears, or perhaps only my mind.\n\nI heard them clearly. I did not care that there was nowhere they could be coming from. They were there. They lasted. For the first time I understood them, believed them and enjoyed them.\n\nIt is one of the few images that stay with me, and will stay for the rest of my life.","original_lang":"sr"}],"tracks":[{"id":"bridge","title":"О чём говорит мост","city":"danube","scene":0,"desc":"Так звучит голос Варадинского моста через Дунай в Нови-Саде. Ему есть, что рассказать о себе и о событиях истории ХХ в., в которой мосты разделяли судьбу строившей их страны. Первый мост, имевший тогда другое название, был построен в 1920-х гг. и стал символом развития межвоенного Нови-Сада. Он был взорван, восстановлен и опять уничтожен во время Второй мировой войны. Потом мост отстроили, дали ему новое имя, но во время бомбардировок Югославии в 1999-м и он был разрушен. Мост, существующий сегодня, восстановили только в 2000 г., используя опоры предыдущих конструкций. По человеческим меркам современный Варадинский мост совсем еще молод, но в обертонах его металлического голоса можно уловить отзвуки прошлого, услышать гул  времени, ощутить связь с местом, судьбой народа, страны.","title_en":"What the bridge tells us","title_sr":"O čemu govori most","peaks":[1.0,0.811,0.655,0.404,0.289,0.756,0.787,0.511,0.331,0.816,0.748,0.576,0.432,0.648,0.464,0.501,0.553,0.714,0.477,0.383,0.353,0.363,0.328,0.309,0.509,0.659,0.443,0.25,0.345,0.236,0.15,0.228,0.333,0.273,0.144,0.33,0.368,0.276,0.202,0.257,0.266,0.17,0.456,0.486,0.529,0.699,0.625,0.988,0.845,0.695,0.514,0.482,0.462,0.393,0.343,0.279,0.176,0.099,0.237,0.289,0.305,0.233,0.274,0.271,0.211,0.177,0.346,0.376,0.303,0.218,0.272,0.259,0.153,0.091,0.036,0.022],"desc_en":"This is the voice of the Varadin Bridge across the Danube in Novi Sad. It has much to tell us about its life and the history of the twentieth century, when bridges shared the fate of the country that built them.\n\nThe first bridge, then known by another name, was built in the 1920s. It became a symbol of Novi Sad's growth between the wars. It was blown up, rebuilt and destroyed again during World War II. Later it was rebuilt and renamed, but it was destroyed once more during the bombing of Yugoslavia in 1999.\n\nThe bridge we see today was restored only in 2000, using supports from earlier structures. By human standards it is still young. Yet in the echoes of its metallic voice we can hear the past, the sound of time and the bond between a place, its people and its country.","desc_sr":"Ovako zvuči Varadinski most preko Dunava u Novom Sadu. Ima mnogo toga da ispriča o svojoj sudbini i istoriji XX veka, kada su mostovi delili sudbinu zemlje koja ih je izgradila.\n\nPrvi most, tada pod drugim imenom, podignut je dvadesetih godina i postao simbol razvoja Novog Sada između dva rata. Bio je srušen, obnovljen i ponovo uništen tokom Drugog svetskog rata. Kasnije je obnovljen i dobio novo ime, ali je uništen i tokom bombardovanja Jugoslavije 1999. Današnji most obnovljen je tek 2000. godine, na stubovima ranijih konstrukcija.\n\nPo ljudskim merilima Varadinski most je još mlad, ali u njegovom metalnom glasu čuju se odjeci prošlosti, šum vremena i veza grada sa sudbinom njegovih stanovnika.","preview_ru":"Так звучит голос Варадинского моста через Дунай в Нови-Саде. Ему есть, что рассказать о себе и о событиях истории ХХ в., в которой мосты разделяли судьбу строившей их страны."},{"id":"sphinx","title":"Говорит сфинкс","city":"neva","scene":1,"desc":"Звучит «западный» сфинкс – правый, если встать на набережной спиной к Академии художеств.\n\nСфинксы Аменхотепа III, созданные в XIV в. до н.э. для Поминального храма фараона в Фивах, были обнаружены в XIX в., в период расцвета европейской моды на египетскую древность. После долгих приключений с приобретением и перевозкой скульптур, сфинксы оказались в Петербурге и в 1834 г. заняли пьедесталы на набережной Невы у Академии художеств, на пристани, спроектированной архитектором Тоном.\n\nСфинксы, наверное, многое помнят, в том числе и сюжет о прибытии в Петербург. Но они не рассказывают истории. «… Аменхотеп, властитель Фив, возлюбленный Амоном, именем мощный, которому дана жизнь в вечности, подобно Ра», написано на основании скульптуры «западного» сфинкса.  Если вода, по словам известного поэта, это время, то сфинкс – вечность. Вслушиваясь в плеск воды-времени в сопровождении невского ветра, в звучании сфинкса можно расслышать голос вечности – загадочный, даже пугающий.","title_en":"The sphinx speaks","title_sr":"Govori sfinga","peaks":[0.103,0.107,0.125,0.59,0.592,0.575,0.471,0.586,0.432,0.226,0.271,0.209,0.21,0.251,0.299,0.324,0.3,0.231,0.275,0.537,0.431,0.685,0.423,0.498,0.453,0.504,0.454,0.511,0.568,0.518,0.682,1.0,0.539,0.367,0.489,0.554,0.625,0.679,0.665,0.533,0.607,0.524,0.468,0.391,0.431,0.594,0.642,0.385,0.476,0.671,0.308,0.288,0.308,0.339,0.254,0.29,0.268,0.206,0.275,0.206,0.33,0.545,0.716,0.736,0.626,0.56,0.227,0.375,0.231,0.397,0.179,0.148,0.153,0.194,0.201,0.223],"desc_en":"We hear the western sphinx, the one on the right if you stand on the embankment with your back to the Academy of Arts.\n\nThe sphinxes of Amenhotep III were carved in the fourteenth century BCE for the pharaoh's memorial temple in Thebes. They were discovered in the nineteenth century, when Europe was fascinated by ancient Egypt. After a complicated story of purchase and transport, they reached Saint Petersburg. In 1834 they took their places beside the Neva, near the Academy of Arts, on the landing designed by architect Konstantin Thon.\n\nThe sphinxes must remember a great deal, including their arrival in the city. But they do not tell stories. The inscription on the base of the western sphinx names Amenhotep, ruler of Thebes, beloved of Amun, whose name is powerful and whose life is eternal like Ra.\n\nIf water is time, as a famous poet said, then the sphinx is eternity. Listen to the water and the Neva wind. In the sound of the sphinx we may hear the voice of eternity, mysterious and perhaps a little frightening.","desc_sr":"Čujemo „zapadnu” sfingu, desnu ako na keju stojimo leđima okrenuti Akademiji umetnosti.\n\nSfinge Amenhotepa III nastale su u XIV veku pre nove ere za faraonov posmrtni hram u Tebi. Otkrivene su u XIX veku, u doba evropskog oduševljenja drevnim Egiptom. Posle složenog puta kupovine i prevoza stigle su u Peterburg i 1834. postavljene na obalu Neve kod Akademije umetnosti, na pristaništu koje je projektovao arhitekta Ton.\n\nSfinge sigurno mnogo pamte, ali ne pričaju priče. Na postolju zapadne sfinge nalazi se natpis o Amenhotepu, vladaru Tebe, miljeniku Amona, kome je dat večni život poput Raa.\n\nAko je voda vreme, kako je rekao jedan pesnik, sfinga je večnost. U pljuskanju vode, vetru sa Neve i glasu kamena može se čuti tajanstven, možda i zastrašujući glas večnosti.","preview_ru":"Звучит «западный» сфинкс – правый, если встать на набережной спиной к Академии художеств. Сфинксы Аменхотепа III были созданы в XIV в. до н. э. для Поминального храма фараона в Фивах."},{"id":"tram","title":"Шёл трамвай","city":"neva","scene":3,"desc":"Шел трамвай, одиннадцатый номер… В начале 1990-х он ходил по Университетской набережной мимо Академии художеств и Румянцевского (Соловьевского) сада. Его звонок бодро приветствовал Неву и задорно поддразнивал склочных чаек.\n\nКогда-то в Ленинграде были очень популярны летние эстрады – в Нижнем парке Петергофа, в ЦПКиО на Елагином острове, в парке Екатерингоф, в Румянцевском саду. И до войны – в 1930-х, и после – в 1950-х, военные духовые оркестры играли здесь старинные марши и вальсы. Но постепенно привычки горожан изменились, музыка смолкла, эстрады опустели и обветшали. Летний музыкальный павильон в Румянцевском саду сгорел в 1989 г.\n\nТеперь традиция возвращается – эстрада в Румянцевском восстановлена, здесь снова звучит музыка. Только вот трамвай по набережной давно уже не ходит.\n\nНо стоит услышать звуки духового оркестра и память собирает и соединяет всё: музыку, звонки трамвая, крики чаек, плеск воды. И возникает, как вспоминал А. Городницкий, «странное чувство мечтательной грусти, как будто кто-то теплой и влажной рукой осторожно берет тебя за сердце…».","title_en":"A tram once passed","title_sr":"Prošao je tramvaj","peaks":[0.204,0.323,0.294,0.332,0.298,0.274,0.288,0.333,0.252,0.256,0.218,0.255,0.195,0.054,0.433,0.876,0.65,1.0,0.763,0.803,0.71,0.539,0.567,0.543,0.679,0.534,0.566,0.542,0.601,0.582,0.527,0.545,0.599,0.55,0.454,0.351,0.161,0.051,0.049,0.155,0.187,0.184,0.174,0.178,0.173,0.169,0.162,0.132,0.107,0.23,0.358,0.274,0.317,0.335,0.291,0.276,0.341,0.405,0.29,0.304,0.348,0.274,0.282,0.339,0.293,0.345,0.29,0.366,0.276,0.289,0.338,0.248,0.259,0.214,0.23,0.24],"desc_en":"A tram once passed here, number eleven. In the early 1990s it ran along the University Embankment, past the Academy of Arts and the Rumyantsev Garden. Its bell cheerfully greeted the Neva and teased the rather dull seagulls.\n\nSummer music stages were once very popular in Leningrad, in the Lower Park of Peterhof, on Yelagin Island, in Yekateringof Park and in the Rumyantsev Garden. Before the war in the 1930s and again after it in the 1950s, military brass bands played old marches and waltzes in these places.\n\nGradually the city's habits changed. The music stopped, the stages stood empty and fell into disrepair. The summer music pavilion in the Rumyantsev Garden burned down in 1989. Today the tradition is returning. The stage has been restored and music can be heard there again. But the tram has not run along the embankment for many years.\n\nListen to a brass band and memory begins to put things together: music, tram bells, seagull cries, the sound of water. The result is what Alexander Gorodnitsky called a strange, dreamy sadness, as if someone gently touched your heart with a warm, damp hand.","desc_sr":"Nekada je ovuda prolazio tramvaj broj jedanaest. Početkom devedesetih vozio je Univerzitetskim kejom pored Akademije umetnosti i Rumjancevskog vrta. Njegovo zvonce veselo je pozdravljalo Nevu i zadirkivalo galebove.\n\nU Lenjingradu su nekada bile veoma popularne letnje muzičke pozornice, u Peterhofu, na Jelaginom ostrvu, u Jekateringofskom parku i Rumjancevskom vrtu. Pre rata, tridesetih godina, i posle rata, pedesetih, vojni duvački orkestri svirali su stare marševe i valcere.\n\nVremenom su se navike promenile. Muzika je utihnula, pozornice su opustele. Paviljon u Rumjancevskom vrtu izgoreo je 1989. Danas je obnovljen i muzika se vratila. Tramvaj, međutim, odavno ne prolazi obalom.\n\nZvuk duvačkog orkestra ponovo povezuje sve u sećanju: muziku, tramvajska zvona, galebove i pljusak vode. Ostaje čudna, sanjiva tuga, kao da neko toplom i vlažnom rukom nežno dodiruje srce.","preview_ru":"Шел трамвай, одиннадцатый номер… В начале 1990-х он ходил по Университетской набережной мимо Академии художеств и Румянцевского (Соловьевского) сада."},{"id":"autumn","title":"Осенний дождь, как много лет назад…","city":"danube","scene":5,"desc":"Легендарный петербургский актер Николай Мартон читает стихи легендарного сербского поэта Мирослава Антича. Антич был 1932 года рождения, Мартон родился в 1934-м – они ровесники. Бо‎́‎льшая часть жизни Мирослава Антича прошла в Нови-Саде, на берегах Дуная. Бо‎́‎льшая часть жизни Николая Мартона связана с городом на Неве. Может быть поэтому стихи поэта из Нови-Сада в исполнении Мартона звучат очень по-петербургски: тень и золото загадочных карет, затонувшие корабли, несмелая улыбка сквозь дымку осеннего дождя под надрывный чаячий плач и мерный шум набегающей на берег волны.","title_en":"Autumn rain, so many years ago","title_sr":"Jesenja kiša, kao pre mnogo godina","peaks":[0.323,0.278,0.167,0.133,0.802,1.0,0.735,0.674,0.759,0.653,0.867,0.79,0.705,0.508,0.608,0.414,0.479,0.651,0.998,0.591,0.73,0.629,0.374,0.77,0.353,0.962,0.877,0.804,0.541,0.448,0.446,0.124,0.854,0.685,0.77,0.565,0.59,0.649,0.815,0.741,0.643,0.563,0.446,0.121,0.83,0.526,0.707,0.653,0.622,0.694,0.501,0.37,0.336,0.543,0.731,0.591,0.606,0.459,0.391,0.121,0.388,0.13,0.193,0.157,0.19,0.211,0.177,0.135,0.122,0.12,0.213,0.193,0.151,0.115,0.117,0.113],"desc_en":"The celebrated Saint Petersburg actor Nikolai Marton reads poems by the celebrated Serbian poet Miroslav Antić. Antić was born in 1932 and Marton in 1934. They were almost the same age.\n\nAntić spent much of his life in Novi Sad, on the banks of the Danube. Marton's life was closely tied to the city on the Neva. Perhaps that is why Antić's poems, read by Marton, sound so much like Saint Petersburg: the shadows and gold of mysterious carriages, sunken boats, a shy smile through the mist of autumn rain, the sharp cries of gulls and the steady sound of waves reaching the shore.","desc_sr":"Poznati peterburški glumac Nikolaj Marton čita stihove poznatog srpskog pesnika Miroslava Antića. Antić je rođen 1932, a Marton 1934. godine. Bili su gotovo vršnjaci.\n\nAntić je veći deo života proveo u Novom Sadu, na obali Dunava. Martonov život vezan je za grad na Nevi. Možda zato Antićevi stihovi u njegovom izvođenju zvuče tako peterburški: senke i zlato tajanstvenih kočija, potonuli brodovi, stidljiv osmeh kroz jesenju kišu, krikovi galebova i ravnomerni šum talasa.","preview_ru":"Легендарный петербургский актер Николай Мартон читает стихи легендарного сербского поэта Мирослава Антича. Антич родился в 1932 году, Мартон – в 1934-м, они ровесники."},{"id":"rain","title":"Дождь на Неве","city":"neva","scene":3,"desc":"Выпускник архитектурного факультета Академии художеств Альберт Асадуллин в 1975-м спел партию Орфея в первой советской рок-опере «Орфей и Эвридика», в 1977-м  – Уленшпигеля в рок-опере «Фламандская легенда», в 2023-м – Господина Светеборга, Волшебника и Света в мюзикле «Синяя птица» петербургского Детского музыкального театра «Зазеркалье»…\n\nА здесь Альберт Асадуллин рассказывает о первом знакомстве с Ленинградом и в сопровождении джаз-бенда Олега Кувайцева исполняет любимую ленинградцами песню, помните?\n\n«Не изменяя весёлой традиции,\nДождиком встретил меня Ленинград…»\n\nВ 1963 году студент режиссёрского курса Георгия Товстоногова Борис Гершт вместе со своим другом, актёром Константином Григорьевым, написали для музыкального спектакля на Ленинградском телевидении несколько стихотворений, положенных на музыку композитором Вадимом Шеповаловым. Скоро песню о ленинградском дожде запел весь город, а потом и вся страна.\n\n«Что нам лишения, что испытания\nМы закалились под этим дождём\nМы - ленинградцы с тобой по призванию\nХоть не всегда в Ленинграде живем»","title_en":"Rain on the Neva","title_sr":"Kiša na Nevi","peaks":[0.569,0.992,1.0,0.906,0.887,0.609,0.967,0.721,0.937,0.799,0.943,0.832,0.538,0.678,0.686,0.814,0.606,0.523,0.685,0.705,0.707,0.761,0.789,0.93,0.872,0.813,0.794,0.798,0.697,0.778,0.74,0.765,0.791,0.754,0.827,0.799,0.861,0.772,0.763,0.778,0.714,0.739,0.712,0.783,0.748,0.782,0.709,0.755,0.793,0.797,0.819,0.717,0.677,0.685,0.729,0.734,0.727,0.709,0.751,0.647,0.676,0.676,0.655,0.656,0.767,0.783,0.707,0.722,0.739,0.761,0.854,0.833,0.813,0.715,0.665,0.416],"desc_en":"Albert Asadullin graduated from the architecture department of the Academy of Arts. In 1975 he sang Orpheus in the first Soviet rock opera, Orpheus and Eurydice. In 1977 he played Till Eulenspiegel in The Flemish Legend. In 2023 he appeared as Lord Sveteborg, the Magician and Light in The Blue Bird at the Saint Petersburg children's musical theatre Zazerkalye.\n\nHere Albert Asadullin recalls his first meeting with Leningrad. Accompanied by Oleg Kuvaytsev's jazz band, he performs a song loved by the city's residents. You may remember it: Leningrad greeted the singer with rain, keeping up its cheerful tradition.\n\nIn 1963 Boris Gersht, a student of Georgy Tovstonogov's directing course, and his friend, actor Konstantin Grigoryev, wrote several poems for a musical show on Leningrad television. Composer Vadim Shepovalov set them to music. Soon the whole city was singing the song about Leningrad rain. Then the whole country was singing it too.\n\nThe song speaks of hardships and trials, of people strengthened by the rain, and of feeling like Leningraders even when they live far away.","desc_sr":"Albert Asadulin diplomirao je na Arhitektonskom fakultetu Akademije umetnosti. Godine 1975. pevao je Orfeja u prvoj sovjetskoj rok operi „Orfej i Euridika”, 1977. Tila Ojlenšpigela u „Flamanskoj legendi”, a 2023. nastupio je u mjuziklu „Plava ptica” peterburškog dečjeg muzičkog pozorišta.\n\nOvde se seća prvog susreta sa Lenjingradom i uz džez orkestar Olega Kuvajceva izvodi pesmu koju su stanovnici grada voleli. Pesma govori o kiši koja je, po veseloj tradiciji, dočekala pevača u Lenjingradu.\n\nGodine 1963. Boris Geršt, student režije kod Georgija Tovstonogova, i njegov prijatelj, glumac Konstantin Grigorjev, napisali su nekoliko stihova za muzičku predstavu na lenjingradskoj televiziji. Kompozitor Vadim Šepovalov napisao je muziku. Ubrzo je pesmu pevao ceo grad, a zatim i čitava zemlja. U njoj su kiša, iskušenja i osećaj pripadnosti Lenjingradu, čak i kada čovek ne živi tamo.","preview_ru":"Выпускник архитектурного факультета Академии художеств Альберт Асадуллин в 1975-м спел партию Орфея в первой советской рок-опере «Орфей и Эвридика». А здесь он рассказывает о первом знакомстве с Ленинградом и исполняет песню «Дождь на Неве»."},{"id":"dove","title":"Гугутка","city":"danube","scene":2,"desc":"«Гугу-тка, гугу-тка, гугу-тка» … В лесной полосе на берегу Дуная напротив Петроварадинской крепости  под звуки воды, собачий лай и щебет неизвестных птиц солирует кольчатая горлица. Она изящнее и стройнее обычных сизых голубей, выглядит скромно, но элегантно: бежево-коричневое оперение, концы крыльев темные, а на шее черно-белое незамкнутое «ожерелье». Птица любит селиться в парках, садах, в густых лесных зарослях, строит на деревьях гнезда, довольно небрежно набрасывая в развилках ветвей небольшую «кучу» из тонких веточек. Горлица не умеет петь – зато, не открывая клюва, то ли воркует, то ли кукует, то ли ухает почти по-совиному. «Гугутка» – так называют эту птицу в Сербии. Но горлицу-гугутку можно услышать и в окрестностях Петербурга, в Ленинградской области – теперь вы ее точно ни с кем не спутаете!","title_en":"The turtle dove","title_sr":"Gugutka","peaks":[0.113,0.102,0.118,0.138,0.115,0.128,0.125,0.1,0.085,0.106,0.089,0.089,0.091,0.112,0.087,0.092,0.088,0.108,0.09,0.101,0.134,0.151,0.118,0.307,0.479,0.435,0.532,0.569,0.736,0.717,0.869,0.791,0.807,0.729,0.713,0.68,0.691,0.751,1.0,0.691,0.7,0.979,0.545,0.835,0.512,0.509,0.492,0.829,0.512,0.47,0.452,0.504,0.48,0.924,0.464,0.477,0.401,0.129,0.114,0.146,0.106,0.115,0.146,0.107,0.142,0.146,0.159,0.118,0.091,0.046,0.039,0.035,0.027,0.036,0.038,0.05],"desc_en":"“Gugu-tka, gugu-tka, gugu-tka...” In a wooded area on the Danube opposite Petrovaradin Fortress, a collared dove sings its part among the sounds of water, barking dogs and other birds.\n\nIt is slimmer and more graceful than the common grey pigeon. Its colours are modest but elegant: beige-brown feathers, dark wingtips and a black-and-white open collar around the neck.\n\nThese birds like parks, gardens and thick woods. They build rather untidy nests in trees, a little pile of thin twigs in the fork of a branch. The dove cannot really sing. Instead, with its beak closed, it makes a sound somewhere between a coo, a cuckoo call and an owl's hoot.\n\nIn Serbia it is called a gugutka. You can hear the same bird around Saint Petersburg and in the Leningrad region. Now you will know its voice!","desc_sr":"„Gugu-tka, gugu-tka...” U šumarku na obali Dunava naspram Petrovaradinske tvrđave, uz vodu, lavež pasa i cvrkut drugih ptica, čuje se gugutka, ogrličasta grlica.\n\nVitkija je i elegantnija od običnog goluba. Ima bež-smeđe perje, tamne vrhove krila i crno-belu ogrlicu oko vrata. Voli parkove, bašte i gusta stabla, gde pravi prilično neuredna gnezda od tankih grančica.\n\nGugutka ne peva u uobičajenom smislu. Zatvorenog kljuna guče, kukuje ili se oglašava gotovo kao sova. Može se čuti i u okolini Sankt Peterburga. Sada ćete sigurno prepoznati njen glas!","preview_ru":"«Гугу-тка, гугу-тка, гугу-тка»… В лесной полосе на берегу Дуная напротив Петроварадинской крепости под звуки воды, собачий лай и щебет птиц солирует кольчатая горлица."},{"id":"waltz","title":"«Голубой Дунай» на берегах Невы","city":"both","scene":4,"desc":"Знаменитый вальс Иоганна Штрауса-младшего «На прекрасном голубом Дунае» («Голубой Дунай»), созданный в Вене в 1866 г., исполняет оркестр Марека Вебера – один из самых известных эстрадных коллективов в Европе 1920-х–1930-х гг. Запись сделана на пластинке Ленинградского завода грампластинок, торжественно открытого в 1948 г. и первоначально оборудованного трофейной техникой немецкого завода грампластинок «Tempo». Пластинка 78 оборотов в минуту 1949 года выпуска, о чем свидетельствует номер на этикетке 16928. Такие пластинки проигрывались всего 2-3 минуты, выпуск долгоиграющих пластинок начнут на заводе только в 1956-м. Надпись под ГОСТОМ «третий кл.» означает «третий класс» – так в советской системе классификации указывалась категория музыки. Третий класс – это эстрадные или танцевальные записи. В верхней части бумажного круга – изображение скульптуры В.И. Мухиной «Рабочий и колхозница», в те годы оно иногда использовалось в качестве эмблемы предприятия.  В 1964 г. Ленинградский завод грампластинок войдет в структуру ВФГ «Мелодия» и на этикетках появится знакомый многим логотип в виде стилизованной буквы «М».","title_en":"The Blue Danube on the Neva","title_sr":"Na lepom plavom Dunavu na obali Neve","peaks":[0.36,0.269,0.343,0.593,0.486,0.55,0.548,0.429,0.53,0.424,0.364,0.676,0.434,0.502,0.434,0.607,0.788,0.365,0.5,0.58,0.392,0.387,0.469,0.391,0.434,0.659,0.378,0.562,0.32,0.439,0.604,0.347,0.565,0.697,0.674,0.642,0.57,0.54,0.683,0.553,0.458,0.397,0.416,0.526,0.362,0.723,0.526,0.498,0.444,0.356,0.391,0.657,0.829,0.462,0.506,0.419,0.603,0.662,0.651,0.669,0.674,0.693,0.857,0.812,0.716,0.734,0.542,0.71,0.628,0.473,0.479,0.583,1.0,0.633,0.615,0.464],"desc_en":"Johann Strauss the Younger's famous waltz On the Beautiful Blue Danube, written in Vienna in 1866, is performed here by Marek Weber's orchestra, one of Europe's best-known popular orchestras of the 1920s and 1930s.\n\nThe music comes from a record made by the Leningrad Record Factory. The factory opened in 1948 and was initially equipped with machinery taken from the German Tempo record factory. This is a 78 rpm record released in 1949, as shown by the catalogue number 16928 on its label.\n\nSuch records played for only two or three minutes. The factory did not begin making long-playing records until 1956. The words “third class” below the Soviet state standard mark the category of music. In this classification, the third class meant popular or dance recordings.\n\nThe upper part of the label shows Vera Mukhina's sculpture Worker and Collective Farm Woman, sometimes used as the company's emblem. In 1964 the Leningrad factory became part of the Melodiya record company. Its labels then gained the familiar stylised letter M.","desc_sr":"Čuveni valcer Johana Štrausa mlađeg „Na lepom plavom Dunavu”, nastao u Beču 1866, izvodi orkestar Mareka Vebera, jedan od najpoznatijih evropskih zabavnih orkestara dvadesetih i tridesetih godina.\n\nSnimak je na gramofonskoj ploči Lenjingradske fabrike ploča, otvorene 1948. godine. Prvobitno je koristila opremu nemačke fabrike Tempo. Ploča ima 78 obrtaja u minuti i izdata je 1949, što potvrđuje broj 16928 na etiketi. Takve ploče trajale su samo dva do tri minuta. Dugosvirajuće ploče počele su da se proizvode tek 1956.\n\nOznaka „treća klasa” označavala je zabavnu ili plesnu muziku. Na vrhu etikete bila je skulptura Vere Muhine „Radnik i kolhoznica”, povremeni znak fabrike. Godine 1964. fabrika je ušla u sastav diskografske kuće Melodija i na etiketi se pojavio njen poznati znak u obliku slova M.","preview_ru":"Знаменитый вальс Иоганна Штрауса-младшего «На прекрасном голубом Дунае» («Голубой Дунай»), созданный в Вене в 1866 г., исполняет оркестр Марека Вебера – один из самых известных эстрадных коллективов в Европе 1920-х–1930-х гг."},{"id":"birds","title":"Дунай. Май 2026","c
